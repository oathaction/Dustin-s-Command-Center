<svg xmlns="http://www.w3.org/2000/svg" class="oac-svg oac-sketch" viewBox="-8 -8 288 142" width="288" height="142" role="img" aria-labelledby="s-14-91-sketch-t s-14-91-sketch-d">
<title id="s-14-91-sketch-t">Gauge, a sketch of the form to avoid</title>
<desc id="s-14-91-sketch-d">A gauge sets an illustrative 70 of 100 as a needle’s angle on a dial, and a progress bar of the same values shows it as a length a reader can measure against the mark at 80.</desc>
<text x="0" y="4" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="13">Illustrative data</text>
<g transform="translate(26 -10)">
<path d="M26 128A84 84 0 0 1 194 128" class="oac-f-none oac-s-track" stroke-width="16"/>
<path d="M26 128A84 84 0 0 1 159.4 60" class="oac-f-none oac-s-subject" stroke-width="16"/>
<path d="M110 128L146.4 77.8" class="oac-s-subject" stroke-width="3"/><circle cx="110" cy="128" r="5" class="oac-f-subject"/>
<path d="M168.2 85.7L187.7 71.6" class="oac-s-baseline" stroke-width="2"/><text x="197.8" y="65.7" class="oac-t oac-t-tick oac-w6 oac-f-label" font-size="13">80</text>
<text x="74" y="122" class="oac-t oac-t-big oac-w7 oac-f-label" font-size="26" text-anchor="middle">70</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="oac-svg oac-sketch" data-label="Progress bar" viewBox="-8 -8 288 142" width="288" height="142" role="img" aria-labelledby="s-14-91-sketch-t2 s-14-91-sketch-d2">
<title id="s-14-91-sketch-t2">Progress bar, the better choice</title>
<desc id="s-14-91-sketch-d2">The same value as a bar filled to 70 of 100, with a tick at the mark of 80 and the 10 it lacks printed.</desc>
<text x="0" y="4" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="13">Illustrative data</text>
<g transform="translate(0 -10)">
<rect x="4" y="52" width="264" height="24" class="oac-f-track"/>
<rect x="4" y="52" width="184.8" height="24" class="oac-f-subject"/>

<text x="215.2" y="38" class="oac-t oac-t-tick oac-w6 oac-f-label" font-size="13" text-anchor="middle">Mark at 80</text>
