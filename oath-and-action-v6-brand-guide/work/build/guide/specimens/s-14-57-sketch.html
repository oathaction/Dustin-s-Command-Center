<svg xmlns="http://www.w3.org/2000/svg" class="oac-svg oac-sketch" viewBox="0 0 220 160" width="220" height="160" role="img" aria-labelledby="s-14-57-sketch-t s-14-57-sketch-d">
<title id="s-14-57-sketch-t">3D pie, a sketch of the form to avoid</title>
<desc id="s-14-57-sketch-d">A tilted 3D pie draws two equal illustrative shares so the nearer one looks larger, and flat bars of the same values show them as equal lengths.</desc>
<text x="0" y="14" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="15">Illustrative data</text>
<path d="M10 84A100 42 0 0 1 210 84Z" class="oac-f-cat-2"/>
<path d="M10 84V110A100 42 0 0 0 210 110V84A100 42 0 0 1 10 84Z" class="oac-f-cat-1"/>
<path d="M10 84A100 42 0 0 0 210 84Z" class="oac-f-cat-1"/>
<path d="M10 84H210" class="oac-s-gridline" stroke-width="1"/>
<text x="110" y="70" class="oac-t oac-t-label oac-w7 oac-f-on-cat-2" font-size="15" text-anchor="middle">A, 50%</text><text x="110" y="114" class="oac-t oac-t-label oac-w7 oac-f-label-on-subject" font-size="15" text-anchor="middle">B, 50%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="oac-svg oac-sketch" data-label="Bars" viewBox="0 0 240 108" width="240" height="108" role="img" aria-labelledby="s-14-57-sketch-t2 s-14-57-sketch-d2">
<title id="s-14-57-sketch-t2">Bars, the better choice</title>
<desc id="s-14-57-sketch-d2">The same two shares as flat bars from one zero line, A and B at 50 percent each, the same length.</desc>
<text x="0" y="14" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="15">Illustrative data</text>
<path d="M40.75 30V98" class="oac-s-baseline" stroke-width="1.5"/>
<rect x="41.5" y="36" width="125" height="20" class="oac-f-cat-2"/>
<text x="32" y="51" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="15" text-anchor="end">A</text>
<text x="172.5" y="51" class="oac-t oac-t-label oac-w7 oac-f-label" font-size="15">50%</text>
<rect x="41.5" y="70" width="125" height="20" class="oac-f-cat-1"/>
<text x="32" y="85" class="oac-t oac-t-label oac-w6 oac-f-label" font-size="15" text-anchor="end">B</text>
<text x="172.5" y="85" class="oac-t oac-t-label oac-w7 oac-f-label" font-size="15">50%</text>
</svg>
