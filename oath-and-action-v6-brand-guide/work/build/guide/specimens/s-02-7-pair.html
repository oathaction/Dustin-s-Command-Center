<div class="ed pair"><figure class="ex before"><figcaption class="exh"><span class="chip">Before</span><span class="s">An interactive version of our systems atlas, the guided story, part “Whether voters can fire them”</span></figcaption><p class="q"><del>Accountability depends on a real chance of losing.</del> In most districts the general election is easy to predict, so the contest that decides the seat is a low-turnout primary. Incumbents also help write the rules for their own races, from district maps to voting procedures. <del>When few officials face a competitive race, the pressure to serve the whole electorate fades.</del></p></figure><div class="hinge" aria-hidden="true"><img data-inline src="work/build/assets/identity/ampersand/20261028_Amp-B-24px-Master.svg" alt="" class="hamp" width="21" height="24"></div><figure class="ex after"><figcaption class="exh"><span class="chip solid">After</span></figcaption><p class="q"><ins>The pressure on officials to serve the whole electorate depends on a real chance of losing.</ins> In most districts the general election is easy to predict, so the contest that decides the seat is a low-turnout primary. Incumbents also help write the rules for their own races, from district maps to voting procedures.</p></figure></div>
