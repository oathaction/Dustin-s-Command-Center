<!-- data-oa-theme-for names the element the switch sets: here the sample page around it, so the guide's specimen
     changes only its own stage. In a product, leave the attribute out: the switch then sets the page's root and keeps
     the reader's choice. Put the head script from the script file in the page's head. -->
<div class="oa-theme-page" id="oa-theme-page">
  <fieldset class="oa-theme" data-oa-theme-for="oa-theme-page">
    <legend class="oa-theme-legend">Theme</legend>
    <div class="oa-theme-row">
      <label class="oa-theme-item">
        <input class="oa-theme-input" type="radio" name="oa-theme" value="light">
        <span class="oa-theme-face"><svg class="oa-theme-check" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-selected-check" data-icon-family="utility"><path d="M4 12.5 L9 17.5 L20 6.5"/></svg><span class="oa-theme-label">Light</span></span>
      </label>
      <label class="oa-theme-item">
        <input class="oa-theme-input" type="radio" name="oa-theme" value="dark">
        <span class="oa-theme-face"><svg class="oa-theme-check" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-selected-check" data-icon-family="utility"><path d="M4 12.5 L9 17.5 L20 6.5"/></svg><span class="oa-theme-label">Dark</span></span>
      </label>
      <label class="oa-theme-item">
        <input class="oa-theme-input" type="radio" name="oa-theme" value="device" checked>
        <span class="oa-theme-face"><svg class="oa-theme-check" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-selected-check" data-icon-family="utility"><path d="M4 12.5 L9 17.5 L20 6.5"/></svg><span class="oa-theme-label">Match my device</span></span>
      </label>
    </div>
  </fieldset>
  <p class="oa-theme-sample">Every color on this page follows the theme you choose.</p>
</div>
