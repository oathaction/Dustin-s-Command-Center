<form class="oa-form" data-oa-form novalidate>
  <p class="oa-form-illus">Illustrative</p>
  <p class="oa-form-title">Get a reminder before the March 3 hearing</p>
  <p class="oa-form-lede">We email you two days before the hearing on H.99001, with how to send testimony.</p>
  <div class="oa-form-field">
    <label class="oa-form-label" for="oa-form-email">Email</label>
    <input class="oa-form-input" id="oa-form-email" name="email" type="email" autocomplete="email" spellcheck="false" data-oa-check="email">
    <p class="oa-form-error" id="oa-form-email-error" hidden><svg class="oa-form-mark" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-error" data-icon-family="utility"><circle cx="12" cy="12" r="9"/><path d="M12 7V13"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg><span><b>Error:</b> Enter an email address with an @, such as name@example.com.</span></p>
  </div>
  <div class="oa-form-field">
    <label class="oa-form-label" for="oa-form-zip">ZIP code</label>
    <p class="oa-form-hint" id="oa-form-zip-hint">Five digits</p>
    <input class="oa-form-input" id="oa-form-zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" aria-describedby="oa-form-zip-hint" data-oa-check="zip">
    <p class="oa-form-error" id="oa-form-zip-error" hidden><svg class="oa-form-mark" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-error" data-icon-family="utility"><circle cx="12" cy="12" r="9"/><path d="M12 7V13"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg><span><b>Error:</b> Enter a ZIP code with five digits.</span></p>
  </div>
  <button type="submit" class="oa-form-send" data-red="working" data-red-job="take part now">Remind me</button>
  <p class="oa-form-status" id="oa-form-status" role="status"></p>
  <template class="oa-form-say-sending">Sending your request.</template>
  <template class="oa-form-say-done"><svg class="oa-form-mark oa-form-mark--ok" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="U-success" data-icon-family="utility"><path d="M20.912 10.747 A9 9 0 1 1 15.945 3.911"/><path d="M7.5 11.5 L11 15 L20.5 5.5"/></svg><span><b>You’re signed up.</b> We’ll email you on March 1, two days before the hearing.</span></template>
</form>
