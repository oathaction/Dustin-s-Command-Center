<div class="oa-toggle-set" data-oa-toggle>
  <p class="oa-toggle-illus">Illustrative</p>
  <p class="oa-toggle-k">A toggle button</p>
  <button
    type="button"
    class="oa-toggle"
    aria-pressed="false"
    data-oa-say-on="You follow this bill. We email you when it moves."
    data-oa-say-off="You no longer follow this bill.">
    <svg
      class="oa-toggle-check"
      viewBox="0 0 24 24"
      width="24"
      height="24"
      aria-hidden="true"
      focusable="false"
      data-icon="U-selected-check"
      data-icon-family="utility">
      <path d="M4 12.5 L9 17.5 L20 6.5"/>
    </svg>
    <span class="oa-toggle-label">Follow this bill</span>
  </button>
  <p class="oa-toggle-status" role="status"></p>

  <p class="oa-toggle-k" id="oa-toggle-chips-k">Show bills on</p>
  <div
    class="oa-toggle-chips"
    role="group"
    aria-labelledby="oa-toggle-chips-k"
    data-oa-say-none="No topic is on, so every bill shows."
    data-oa-say-some="Showing bills on">
    <button
      type="button"
      class="oa-toggle oa-toggle--chip"
      aria-pressed="true">
      <svg
        class="oa-toggle-check"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
        focusable="false"
        data-icon="U-selected-check"
        data-icon-family="utility">
        <path d="M4 12.5 L9 17.5 L20 6.5"/>
      </svg>
      <span class="oa-toggle-label">Housing</span></button>
    <button
      type="button"
      class="oa-toggle oa-toggle--chip"
      aria-pressed="false">
      <svg
        class="oa-toggle-check"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
        focusable="false"
        data-icon="U-selected-check"
        data-icon-family="utility">
        <path d="M4 12.5 L9 17.5 L20 6.5"/>
      </svg>
      <span class="oa-toggle-label">Health care</span></button>
    <button
      type="button"
      class="oa-toggle oa-toggle--chip"
      aria-pressed="false">
      <svg
        class="oa-toggle-check"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
        focusable="false"
        data-icon="U-selected-check"
        data-icon-family="utility">
        <path d="M4 12.5 L9 17.5 L20 6.5"/>
      </svg>
      <span class="oa-toggle-label">Elections</span></button>
    <button
      type="button"
      class="oa-toggle oa-toggle--chip"
      aria-pressed="false"
      aria-disabled="true"
      aria-describedby="oa-toggle-why">
      <svg
        class="oa-toggle-check"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
        focusable="false"
        data-icon="U-selected-check"
        data-icon-family="utility">
        <path d="M4 12.5 L9 17.5 L20 6.5"/>
      </svg>
      <span class="oa-toggle-label">Transit</span></button>
  </div>
  <p class="oa-toggle-why" id="oa-toggle-why">Transit has no bills yet this session, so it cannot be
    turned on.</p>
  <p class="oa-toggle-status" role="status"></p>
</div>
