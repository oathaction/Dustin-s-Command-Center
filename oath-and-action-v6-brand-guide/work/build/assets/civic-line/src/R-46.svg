<svg xmlns="http://www.w3.org/2000/svg" data-id="R-46" viewBox="0 0 240 128">
  <!-- R-46 Expand the House. Crop 240 x 128 px; ink box x 8..232, y 8..120.
       Construction: a broad semicircular legislative chamber viewed schematically from above. A curved outer boundary contains multiple small outlined seat rectangles that follow its arc. More seats form inner curved rows. A small raised dais/podium stands near the top centre, with a short roof/cap-like detail.
       Red: the small group of newly added seats along the chamber's upper-right outer arc. Other seats, curved framing and dais stay black. Count and position the seat rectangles directly from the enlarged reference.
       Counts from the sheet: 22 seats in two types. Outside the chamber line, five outer seats per side,
       15.5 x 9.5 px on the centreline, on one ellipse (centre (120.4, 88.76), rx 106.63, ry 55.72) with
       equal 3 px gaps, each at its drawn tilt (78.4, 44.75, 59.1, 72.4, 79.1 deg from the bottom up,
       mirror-averaged); the right five red. Inside, two rows of three inner seats per side, 12.5 x 11 px,
       lying along circular arcs at equal angles: the upper row overlaps into a chain as drawn, the lower
       row stands apart with 3.5 px gaps. All corners r 2. Mirror axis x 120.4. The chamber line is a half-ellipse (rx 89.3, ry 47.21) on
       vertical feet, stopping at the dais legs. -->
