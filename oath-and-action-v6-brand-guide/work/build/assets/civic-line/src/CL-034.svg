    <polyline id="filament" points="59.6,81 64.65,97 70.3,84.9"/>
    <line id="filament-stem" x1="64.65" y1="97" x2="64.65" y2="112.27"/>
    <path id="collar" d="M50.7 112.27 V118.9 A3 3 0 0 0 53.7 121.9 H75.9 A3 3 0 0 0 78.9 118.9 V117.3"/>
    <path id="cup" d="M55.06 121.9 V126.45 A4.5 4.5 0 0 0 59.56 130.95 H70.2 A4.5 4.5 0 0 0 74.7 126.45 V121.9"/>
