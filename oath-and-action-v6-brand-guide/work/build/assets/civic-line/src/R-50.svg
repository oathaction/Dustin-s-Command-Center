<svg xmlns="http://www.w3.org/2000/svg" data-id="R-50" viewBox="0 0 211 129">
  <!-- R-50 Popular-Vote Options. Crop 211 x 129 px; ink box x 8..203, y 8..121.
       Construction: four small upright ballot/record cards align across the top, each with short black horizontal rules and a small lower mark. A broad collecting brace runs beneath all four. Below it sits a compact outline map of the contiguous United States, with a small check inside.
       Red: the collecting brace and the check inside the US outline. Cards, their rules and the map perimeter stay black. Preserve four cards and the specific simplified mainland silhouette.
       Drawn at W 5.5; the sheet's strokes run 4.4 to 5.0 px.
       Cards: one size (37.87 x 40.3, rx 1.5: outer corners r 4.25 as drawn, square inner corners), evenly spaced 50.79 px apart, each with
       two rules and a lower mark on one rhythm (y 21.9, 31.2, 40.5). Cards 1, 2 and 4 end in a dot;
       card 3 ends in a short dash that starts under the rules, as drawn.
       Brace: hooks up at both ends, a centre stem rising 4.5 px above the bar and dropping 7.2 px
       below it, short of the map. Map: the sheet's centreline, smoothed, with sharp turns kept at the
       north-west corner, the step in the northern border, the Great Lakes notch, the Florida tip and
       the Texas point. Florida is a narrow V whose two coasts merge into one stroke. -->
