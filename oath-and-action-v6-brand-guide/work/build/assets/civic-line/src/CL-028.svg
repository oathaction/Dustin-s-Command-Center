    <line id="rule-1" x1="28.9" y1="30.32" x2="75.25" y2="30.32"/>
    <line id="rule-2" x1="28.9" y1="49.01" x2="57" y2="49.01"/>
    <line id="rule-3" x1="28.9" y1="67.7" x2="52.6" y2="67.7"/>
    <line id="rule-4" x1="28.9" y1="86.39" x2="52.6" y2="86.39"/>
    <circle id="lens" cx="93.82" cy="67.72" r="29.42"/>
    <line id="neck" x1="113.08" y1="89.99" x2="119.7" y2="96.3"/>
