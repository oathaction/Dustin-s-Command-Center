<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-055" viewBox="0 0 208 145">
  <!-- CL-055 Productivity. Crop 208 x 145 px; ink box x 8..200, y 8..137.
       Construction: a worker at a laptop behind a low desk occupies the lower left. A large hollow circular head rises above the worker’s rounded shoulders. A prominent clock sits upper right, with two simple perpendicular hands. A short right-pointing arrow crosses the gap from the worker toward the clock.
       Red: that rightward arrow and the upper/right accent segment of the clock’s circular rim as shown. Clock hands, person, laptop and desk stay black. Preserve the clock as the icon’s second large shape.
       Trace: the desk is a hollow slab (rounded outline, r 2.5) on two splayed legs; the worker's outline runs from the
       desk top over the shoulder into the forearm, which drops to the desk beside the laptop. The clock rim is
       black; its red accent is a crescent on the rim's inner part, full width at about 1:30 and tapering to
       points at 12 and 3 o'clock (two true circles), as on the red sheet. -->
  <g data-role="base">
    <circle id="head" cx="61.29" cy="40.97" r="12.15"/>
    <path id="body" d="M24.18 94.92 L28.0 69.5 C29.13 61.91 35.94 56.2 43.6 56.2 C43.92 56.2 65.27 57.69 66.4 76.5 Q66.7 79.9 69.4 79.9 H83.0 C85.46 79.9 92.4 81.82 92.4 89.0 V94.92"/>
    <path id="forearm-fillet" d="M92.4 89.5 Q92.4 94.92 87.0 94.92"/>
    <path id="arm" d="M48.0 78.15 L48.5 83.0 C49.0 90.0 51.5 94.92 57.0 94.92"/>
    <path id="laptop" d="M97.88 94.92 V69.82 A1.6 1.6 0 0 1 99.48 68.22 H129.8 A1.6 1.6 0 0 1 131.4 69.82 V94.92"/>
    <rect id="desk" x="10.75" y="94.92" width="136.56" height="10.15" rx="2.5"/>
    <line id="leg-left" x1="25.68" y1="105.07" x2="23.08" y2="134.0"/>
    <line id="leg-right" x1="134.7" y1="105.07" x2="136.63" y2="134.0"/>
    <circle id="clock-rim" cx="166.3" cy="42.4" r="31.3"/>
    <polyline id="clock-hands" points="166.3,24.05 166.3,42.4 182.85,42.4"/>
  </g>
  <g data-role="accent">
    <line id="arrow-shaft" x1="87.13" y1="44.4" x2="122.4" y2="44.4"/>
    <polyline id="arrow-head" points="114.6,36.6 122.4,44.4 114.6,52.2"/>
    <path id="clock-rim-accent" class="fill" d="M170.672 14.187 A20.35 20.35 0 0 1 194.844 42.994 A28.55 28.55 0 0 0 170.672 14.187 Z"/>
  </g>
</svg>
