<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-061" viewBox="0 0 187 117">
  <!-- CL-061 Household Income. Crop 187 x 117 px; ink box x 8..179, y 8..109.
       Construction: a simple frontal person at left with hollow round head and an open-bottom rounded shoulder/torso outline. A small closed envelope sits at right, with rectangular border and diagonals forming its upper flap. A short arrow between person and envelope points right toward the envelope.
       Red: the right-pointing arrow. Person and envelope remain black. Preserve the arrow’s actual source direction even though another income metaphor might reverse it.
       Trace: the body is an open arch (two quarter circles r 24.35 joined by a short flat top) whose sides
       end open at the bottom. The head sits 4.2 px right of the arch's centre line, as drawn. The envelope's
       left edge is open where the arrow's tip enters; its flap is a V with equal
       arm angles (42.6 deg), its point 0.5 px left of the envelope centre. -->
  <g data-role="base">
    <circle id="head" cx="45.37" cy="26.56" r="16.02"/>
    <path id="body" d="M10.6 105.7 V74.95 A24.35 24.35 0 0 1 34.95 50.6 H47.35 A24.35 24.35 0 0 1 71.7 74.95 V105.7"/>
    <path id="envelope" d="M113.65 45.75 V37.67 A2.1 2.1 0 0 1 115.75 35.57 H173.9 A2.1 2.1 0 0 1 176.0 37.67 V84.2 A2.1 2.1 0 0 1 173.9 86.3 H115.75 A2.1 2.1 0 0 1 113.65 84.2 V78.75"/>
    <polyline id="envelope-flap" points="113.65,38.21 144.35,66.45 176.0,37.33"/>
  </g>
  <g data-role="accent">
    <line id="arrow-shaft" x1="81.0" y1="62.48" x2="113.0" y2="62.48"/>
    <polyline id="arrow-head" points="102.65,51.58 113.0,62.48 102.65,73.38"/>
  </g>
</svg>
