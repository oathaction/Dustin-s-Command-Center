<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-060" viewBox="0 0 173 138">
  <!-- CL-060 Taxes & Benefits. Crop 173 x 138 px; ink box x 8..165, y 8..130.
       Construction: an upright record page at left, with a partially open right edge and five horizontal rules. At right are two separated horizontal arrows: the upper points right and the lower points left. Their shafts have similar lengths and their open angled arrowheads face opposite directions.
       Red: the upper right-pointing arrow. Page, information rules and lower left-pointing arrow stay black. Retain the two arrows outside the page rather than drawing them through the text.
       Trace: the page's right edge is open between y 28.75 and 110.63, where the arrows pass. Five rules,
       evenly spaced, shortening downward as drawn. Both arrowheads are the same open chevron; the shafts keep
       their drawn lengths (the lower one reaches 5 px further into the page). -->
  <g data-role="base">
    <path id="page" d="M111.7 28.75 V16.3 A5.3 5.3 0 0 0 106.4 11.0 H16.6 A5.3 5.3 0 0 0 11.3 16.3 V121.7 A5.3 5.3 0 0 0 16.6 127.0 H106.4 A5.3 5.3 0 0 0 111.7 121.7 V110.63"/>
    <line id="rule-1" x1="30.37" y1="31.0" x2="84.55" y2="31.0"/>
    <line id="rule-2" x1="30.37" y1="49.97" x2="84.55" y2="49.97"/>
    <line id="rule-3" x1="30.37" y1="68.94" x2="84.55" y2="68.94"/>
    <line id="rule-4" x1="30.37" y1="87.6" x2="76.45" y2="87.6"/>
    <line id="rule-5" x1="30.37" y1="106.88" x2="67.5" y2="106.88"/>
    <line id="arrow-left-shaft" x1="162.0" y1="86.34" x2="96.9" y2="86.34"/>
    <polyline id="arrow-left-head" points="109.5,73.59 96.9,86.34 109.5,99.09"/>
  </g>
  <g data-role="accent">
    <line id="arrow-right-shaft" x1="102.13" y1="42.03" x2="161.6" y2="42.03"/>
    <polyline id="arrow-right-head" points="149.0,29.28 161.6,42.03 149.0,54.78"/>
  </g>
</svg>
