<svg xmlns="http://www.w3.org/2000/svg" data-id="R-35" viewBox="0 0 179 123">
  <!-- R-35 Term Limits · Rejected. Crop 179 x 123 px; ink box x 8..171, y 8..115.
       Construction: an officeholder at a desk occupies the left, with hollow head, rounded shoulders and short tabletop/legs. A large hollow clock sits behind/right, with two black hands. A filled circular rejection badge overlaps the clock's lower-right area; its centre contains a thick X knockout.
       Red: the rejection disc. The X remains light/negative space, and all other geometry remains black. Preserve the exact caption "Term Limits · Rejected"; the black edition uses a black disc with the same X cutout.
       Clock ring r 29 about (116.5, 54.85), the hands' pivot. The ring stops with flat cuts at the horizontal
       (right) and just past the bottom, leaving an even 5.7 px gap round the badge, which it passes behind.
       The X is a real hole: two W strokes in a mask cut the disc in both editions. -->
  <defs>
    <mask id="x-cut">
      <line x1="138.16" y1="74.3" x2="156.62" y2="92.76"/>
      <line x1="156.62" y1="74.3" x2="138.16" y2="92.76"/>
    </mask>
  </defs>
  <g data-role="base">
    <circle id="head" cx="55.13" cy="22.23" r="11.04"/>
    <path id="body" d="M74.14 63.33 V50.73 A19.01 15.46 0 0 0 55.13 35.27 A19.01 15.46 0 0 0 36.12 50.73 V51.1"/>
    <path id="desk-item" d="M26.37 63.33 L26.99 57.1 A6 6 0 0 1 32.99 51.1 H41.41 A6 6 0 0 1 47.41 57.1 L48.03 63.33"/>
    <path id="desk-top" d="M77 63.33 H15.75 A4.9 4.9 0 0 0 10.85 68.23 V70.6 A4.9 4.9 0 0 0 15.75 75.5 H80.5"/>
    <line id="leg-left" x1="19.69" y1="75.5" x2="19.69" y2="111.6"/>
    <line id="leg-right" x1="84.15" y1="84.6" x2="84.15" y2="111.6"/>
    <path id="clock" class="butt" d="M145.5 54.5 A29 29 0 1 0 118.32 83.79"/>
    <polyline id="hands" points="116.5,40 116.5,54.85 127.25,54.85"/>
  </g>
  <g data-role="accent">
    <circle id="badge" class="fill" cx="147.39" cy="83.53" r="23.35" mask="url(#x-cut)"/>
  </g>
</svg>
