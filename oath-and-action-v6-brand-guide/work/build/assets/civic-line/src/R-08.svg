<svg xmlns="http://www.w3.org/2000/svg" data-id="R-08" viewBox="0 0 165 117">
  <!-- R-08 Donor Disclosure. Crop 165 x 117 px; ink box x 8..157, y 8..109.
       Construction: an upright financial disclosure page with a dollar sign near its upper left and information rules to its right and below. A large empty magnifier lens overlaps the page’s lower-right area, with its handle extending diagonally down-right. The lens obscures the page edge.
       Red: the magnifier’s narrow handle outline. Dollar sign, page, information rules and lens circle are black. Retain the dollar sign that distinguishes this from the general Watchdogs page. -->
  <!-- T4 trace. Page x 10.9..102.45, y 10.63..98.02, rounded corners; its right side breaks round the lens (stops at
       y 26.87, resumes at y 93.13). Dollar sign: S with short plumb ticks on x 35. Lens: true circle r 24.55.
       A short neck on the handle's axis (44.4 deg) joins the lens to the red handle, a stadium outline (ends r 5.6). -->
  <g data-role="base">
    <path id="page" d="M102.45 26.87 V15.63 A5 5 0 0 0 97.45 10.63 H15.9 A5 5 0 0 0 10.9 15.63 V93.02 A5 5 0 0 0 15.9 98.02 H97.45 A5 5 0 0 0 102.45 93.02 V93.13"/>
    <path id="dollar-s" d="M41.4 31.3 C40.2 28.9 37.8 27.6 35 27.6 C31.2 27.6 28.1 30 28.1 33.4 C28.1 37 31.4 38.6 35 40 C38.6 41.4 42 43 42 46.8 C42 50.3 38.9 52.4 35 52.4 C32 52.4 29.5 51 28.3 48.4"/>
    <line id="dollar-tick-top" x1="35" y1="23.37" x2="35" y2="27.6"/>
    <line id="dollar-tick-bottom" x1="35" y1="52.4" x2="35" y2="55.63"/>
    <line id="rule-1" x1="54.75" y1="31.37" x2="85.37" y2="31.37"/>
    <line id="rule-2" x1="54.75" y1="45.12" x2="74" y2="45.12"/>
    <line id="rule-3" x1="27.37" y1="67.19" x2="68.63" y2="67.19"/>
    <line id="rule-4" x1="27.37" y1="80.7" x2="62.63" y2="80.7"/>
    <circle id="lens" cx="106.21" cy="60.56" r="24.55"/>
    <line id="neck" x1="123.83" y1="77.65" x2="130.00" y2="83.68"/>
  </g>
  <g data-role="accent">
    <path id="handle" d="M137.92 83.60 L151.92 97.30 A5.6 5.6 0 0 1 152.00 105.22 A5.6 5.6 0 0 1 144.08 105.30 L130.08 91.60 A5.6 5.6 0 0 1 130.00 83.68 A5.6 5.6 0 0 1 137.92 83.60 Z"/>
