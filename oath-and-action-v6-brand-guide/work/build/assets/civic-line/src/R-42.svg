    <line id="drum-right" x1="89.97" y1="41.08" x2="89.97" y2="50.54"/>
    <line id="cornice" x1="37.73" y1="50.54" x2="97.97" y2="50.54"/>
    <line id="column-left" x1="42.72" y1="50.54" x2="42.72" y2="60.3"/>
    <line id="column-right" x1="92.98" y1="50.54" x2="92.98" y2="60.3"/>
    <line id="pillar-1" x1="55.35" y1="57" x2="55.35" y2="60.3"/>
    <line id="pillar-2" x1="67.85" y1="57" x2="67.85" y2="60.3"/>
    <line id="pillar-3" x1="80.35" y1="57" x2="80.35" y2="60.3"/>
