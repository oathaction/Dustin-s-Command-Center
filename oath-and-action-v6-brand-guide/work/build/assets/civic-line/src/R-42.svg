<svg xmlns="http://www.w3.org/2000/svg" data-id="R-42" viewBox="0 0 248 134">
  <!-- R-42 Congressional Tariff Votes. Crop 248 x 134 px; ink box x 8..240, y 8..126.
       Construction: a small domed legislative building stands at left. A compact ballot box overlaps the centre foreground, with a shallow lid and a slanted ballot. At right is a small rising bar chart on a common baseline. A detached horizontal arrow above the chart points right.
       Red: the ballot's upper/right accent edge and the right-pointing arrow above the chart. Building, box and chart bars remain black. Preserve the actual chart in the source rather than substituting goods or a shipping box.
       Building upper part mirrored about x 67.85 (finial, lantern, elliptical dome rx 19.15 ry 17.18, drum, cornice, columns,
       three short pillars, base line). The lower part keeps its drawn asymmetry: an annex with a slot,
       two pillars, ground line; its right side is hidden behind the ballot box.
       The sheet's right-hand subject is a ribbed box with a top handle (five bays) beside an L-shaped line
       whose short crossbar sits low on its vertical; the arrow runs off the L's top. Traced as drawn.
       Red on the red sheet: the whole ballot outline, and the arrow from x 211.12 to its head. -->
  <g data-role="base">
    <line id="finial" x1="67.85" y1="10.65" x2="67.85" y2="16"/>
    <polyline id="lantern" points="63.1,24.9 63.1,16 72.6,16 72.6,24.9"/>
    <path id="dome" d="M48.7 41.08 A19.15 17.18 0 0 1 87 41.08"/>
