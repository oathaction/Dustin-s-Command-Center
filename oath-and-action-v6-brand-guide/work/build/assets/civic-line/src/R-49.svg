<svg xmlns="http://www.w3.org/2000/svg" data-id="R-49" viewBox="0 0 239 107">
  <!-- R-49 Cross-Party Civic Work. Crop 239 x 107 px; ink box x 8..231, y 8..99.
       Construction: two outline people stand at left and right with hollow heads and rounded shoulders. A small bridge spans between their lower/middle bodies, with a central peaked/arched structural contour and short vertical supports. One broad shallow connecting arc rises over the people and bridge, ending near the outside heads/shoulders.
       Red: the overhead connecting arc. People and bridge stay black. Preserve the open gap beneath the arc and the shared bridge between the two figures.
       One axis, x 118.75, for the people, the bridge and the arc. Both bodies share one half-ellipse
       (rx 27.96, ry 22.88) and both heads one circle (r 12.18), each head centred over its body.
       The shoulders stand in front of each head with a gap, as drawn: a 3.8 px gap on the left, which
       leaves the thin bar under the left head, and a 1.5 px gap under the right figure's collar.
       The right figure keeps its collar line under the head and its hooked right arm. -->
  <defs>
    <mask id="left-shoulder-gap">
      <path id="left-shoulder-gap-cut" data-w="13.1" d="M10.34 83.15 A27.96 22.88 0 0 1 38.3 60.27 A27.96 22.88 0 0 1 66.26 83.15"/>
    </mask>
    <mask id="right-shoulder-gap">
      <path id="right-shoulder-gap-cut" class="butt" data-w="8.5" d="M188.2 62.12 A27.96 22.88 0 0 1 199.2 60.27 A27.96 22.88 0 0 1 210.2 62.12"/>
    </mask>
  </defs>
  <g data-role="base">
