<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-052" viewBox="0 0 200 133">
  <!-- CL-052 Household Security. Crop 200 x 133 px; ink box x 8..192, y 8..125.
       Construction: a large simple home fills the left/back of the icon, with pitched roof, chimney where visible, open doorway and square window. An upright financial record overlaps the house’s right side. Its upper area contains a dollar sign and its lower area two short horizontal rules. The paper extends from near roof height to the house’s baseline.
       Red: the dollar sign on the financial record. Keep house, record outline and rules black. Preserve the overlap rather than placing the page separately beside the house.
       Trace: symmetric roof (apex x 69.46) whose right slope runs over the record's left edge; the walls
       stop short below the roof. The record's left edge is the house's right wall line: above the roof it
       comes down to the roof line, and the record's bottom stops short of the house's corner. The chimney is
       an open three-sided outline floating above the roof, as drawn. -->
  <g data-role="base">
    <polyline id="roof" points="11.06,60.31 69.46,13.24 127.86,60.31"/>
    <polyline id="chimney" points="93.6,20.85 93.6,10.64 111.4,10.64 111.4,31.45"/>
    <path id="house" d="M22.0 62.75 V118.35 A2.5 2.5 0 0 0 24.5 120.85 H114.1 A2.5 2.5 0 0 0 116.6 118.35 V62.75"/>
    <path id="door" d="M41.88 120.85 V79.07 A2 2 0 0 1 43.88 77.07 H58.67 A2 2 0 0 1 60.67 79.07 V120.85"/>
    <rect id="window" x="82.3" y="71.28" width="18.8" height="23.7" rx="2"/>
    <path id="record" d="M124.7 122.57 H186.45 A3 3 0 0 0 189.45 119.57 V39.6 A3 3 0 0 0 186.45 36.6 H119.6 A3 3 0 0 0 116.6 39.6 V51.24"/>
    <line id="rule-1" x1="132.85" y1="92.38" x2="173.7" y2="92.38"/>
    <line id="rule-2" x1="132.85" y1="106.5" x2="173.7" y2="106.5"/>
  </g>
  <g data-role="accent">
    <line id="dollar-bar-top" x1="153.85" y1="49.6" x2="153.85" y2="53.0"/>
    <path id="dollar-s" d="M160.9 56.3 A7.5 6.2 0 0 0 153.9 53 A6.75 5.9 0 0 0 147.15 58.9 A6.75 5.9 0 0 0 153.9 64.8 A6.75 5.9 0 0 1 160.65 70.7 A6.75 5.9 0 0 1 153.9 76.6 A7.5 6.2 0 0 1 146.9 73.3"/>
    <line id="dollar-bar-low" x1="153.85" y1="76.6" x2="153.85" y2="80.0"/>
  </g>
</svg>
