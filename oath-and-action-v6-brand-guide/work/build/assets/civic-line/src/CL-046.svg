       Red: all three small server indicator dots and the chip's inner square outline. Chip body, pins and server framing remain black. Count pins from the reference rather than using a generic chip.
       Trace: three equal rounded trays (27.75 px) stacked edge to edge, notched at the junctions, on two legs.
       Top tray: a long rule whose right end sits under the red dot. Chip: 3 pins per side (12), centred on
       (148.31, 60.92); body and inner square are true squares (62.04 and 21.72 px), per review. -->
