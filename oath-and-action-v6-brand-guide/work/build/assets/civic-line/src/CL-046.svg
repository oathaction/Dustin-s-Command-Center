    <line id="rule-3" x1="24.05" y1="84.12" x2="45.8" y2="84.12"/>
    <rect id="chip" x="118.0" y="29.19" width="60.62" height="63.46" rx="8.5"/>
    <line id="pin-top-1" x1="134.02" y1="10.74" x2="134.02" y2="29.19"/>
    <line id="pin-top-2" x1="148.31" y1="10.74" x2="148.31" y2="29.19"/>
    <line id="pin-top-3" x1="162.6" y1="10.74" x2="162.6" y2="29.19"/>
    <line id="pin-bottom-1" x1="134.02" y1="92.65" x2="134.02" y2="111.1"/>
    <line id="pin-bottom-2" x1="148.31" y1="92.65" x2="148.31" y2="111.1"/>
    <line id="pin-bottom-3" x1="162.6" y1="92.65" x2="162.6" y2="111.1"/>
