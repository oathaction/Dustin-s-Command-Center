<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-046" viewBox="0 0 206 126">
  <!-- CL-046 AI Infrastructure. Crop 206 x 126 px; ink box x 8..198, y 8..118.
       Construction: three stacked rounded server trays occupy the left. Each has a short information rule and a small indicator at right. On the right is a square microchip, with a small central square and short pins projecting from its edges. The chip and server stack share a similar visual height.
       Red: all three small server indicator dots and the chip's inner square outline. Chip body, pins and server framing remain black. Count pins from the reference rather than using a generic chip.
       Trace: three equal rounded trays (27.75 px) stacked edge to edge, notched at the junctions, on two legs.
       Top tray: a long rule whose right end sits under the red dot. Chip: 3 pins per side (12), centred on
       (148.31, 60.92); body 60.62 x 63.46 and inner square 21.3 x 22.15 keep the sheet's slightly tall proportion. -->
  <g data-role="base">
    <rect id="tray-1" x="11.45" y="14.17" width="75.28" height="27.75" rx="5.8"/>
    <rect id="tray-2" x="11.45" y="41.92" width="75.28" height="27.75" rx="5.8"/>
    <rect id="tray-3" x="11.45" y="69.67" width="75.28" height="27.75" rx="5.8"/>
    <line id="leg-left" x1="16.12" y1="97.0" x2="16.12" y2="115.0"/>
    <line id="leg-right" x1="82.06" y1="97.0" x2="82.06" y2="115.0"/>
