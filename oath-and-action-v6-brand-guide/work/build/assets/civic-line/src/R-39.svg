    <path id="portrait-body" d="M29.36 71.37 V63.17 A17.5 14.44 0 0 1 46.86 48.73 A17.5 14.44 0 0 1 64.36 63.17 V71.37"/>
    <line id="rule-1" x1="81.37" y1="33.49" x2="113.25" y2="33.49"/>
    <line id="rule-3" x1="81.37" y1="63.63" x2="113.25" y2="63.63"/>
