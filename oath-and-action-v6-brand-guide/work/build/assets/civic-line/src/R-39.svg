<svg xmlns="http://www.w3.org/2000/svg" data-id="R-39" viewBox="0 0 237 109">
  <!-- R-39 Digital Service Teams. Crop 237 x 109 px; ink box x 8..229, y 8..101.
       Construction: a landscape monitor/service screen occupies the left. Inside is an outline ID portrait at left and several horizontal interface rules at right. A small stand descends below the screen. Two small outline people stand together outside the screen at right, their shoulders partially overlapping.
       Red: the horizontal interface rules to the right of the portrait. Screen, portrait, stand and the two team members remain black. Preserve the portrait-in-screen plus people-outside composition.
       The sheet shows three people outside the screen: a taller centre figure and two smaller figures
       behind it, whose inner shoulders stop short of the centre figure's body. Group mirrored about x 182.18,
       all feet on y 95.85. Only the middle interface rule is red on the red sheet; the others stay black. -->
  <g data-role="base">
    <rect id="screen" x="10.55" y="11.21" width="120.02" height="75.39" rx="6.3"/>
    <line id="stand" x1="70.56" y1="86.6" x2="70.56" y2="98.5"/>
    <line id="stand-base" x1="59.12" y1="98.5" x2="82" y2="98.5"/>
