<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-065" viewBox="0 0 208 158">
  <!-- CL-065 Climate & Insurance. Crop 208 x 158 px; ink box x 8..200, y 8..150.
       Construction: a small house sits lower left with pitched roof and doorway. A rounded rain cloud floats above, followed by several diagonal raindrop strokes. An upright insurance document stands at right. A simple umbrella symbol is centred within that document, with domed canopy and a hooked shaft.
       Red: the umbrella inside the insurance document. Cloud, rain, home and page stay black. Retain the separation between the weather/home grouping and the insurance page. -->
  <!-- T4 trace. House symmetric about x 55.93: roof apex (55.93, 67.7), slants at 38.5 deg, walls x 22.65 and 89.21,
       floor y 144.88, door 47.91..63.95 from y 109.2. Cloud open along its base between x 76 and 126.8.
       Three equal parallel drops at 117 deg. Page with clipped lower-right corner; umbrella centred on x 165.27. -->
  <g data-role="base">
    <polyline id="roof" points="11.13,103.34 55.93,67.7 100.73,103.34"/>
    <polyline id="walls" points="22.65,94.17 22.65,144.88 89.21,144.88 89.21,94.17"/>
    <polyline id="door" points="47.91,144.88 47.91,109.2 63.95,109.2 63.95,144.88"/>
    <path id="cloud" d="M76 51.2 L57.36 51.2 A10.9 10.9 0 0 1 61.2 30.1 L67.5 30.12 A23 23 0 0 1 112.01 27.04 C113.8 26 116.5 24.75 121 24.75 C130.67 24.75 139.6 32.6 139.6 41.1 C139.6 46.77 135.73 51.4 131 51.4 L126.8 51.4"/>
    <line id="drop-1" x1="87.96" y1="54.4" x2="81.03" y2="68"/>
    <line id="drop-2" x1="102.22" y1="54.4" x2="95.28" y2="68"/>
    <line id="drop-3" x1="116.47" y1="54.4" x2="109.54" y2="68"/>
    <polygon id="page" points="134.68,67.35 196.39,67.35 196.39,125.37 178.09,146.58 134.68,146.58"/>
  </g>
  <g data-role="accent">
    <path id="umbrella-canopy" d="M148.05 103.46 A17.3 17.3 0 1 1 182.49 103.46"/>
    <line id="umbrella-rim" x1="148.3" y1="101.3" x2="182.24" y2="101.3"/>
    <line id="umbrella-tip" x1="165.27" y1="84.5" x2="165.27" y2="82.5"/>
    <path id="umbrella-handle" d="M165.27 101.3 V122.7 A4.9 4.9 0 0 1 155.6 123.97"/>
