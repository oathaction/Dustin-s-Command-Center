<svg xmlns="http://www.w3.org/2000/svg" data-id="R-06" viewBox="0 0 231 104">
  <!-- R-06 On-Cycle Elections. Crop 231 x 104 px; ink box x 8..223, y 8..96.
       Construction: two equal small calendars sit side by side. Each has a rounded rectangular outer frame, two short binding uprights across its top edge, a horizontal header divider and a compact grid of square dates. A detached horizontal arrow points right in the gap between calendars. The same date positions are highlighted in both.
       Red: the matching selected date cells in both calendars and the connecting rightward arrow. Calendar frames and other date cells remain black. Count the source date cells before tracing. -->
  <!-- T4 trace. Two identical calendars (the right one is the left moved 131.9 px): rounded frame, header rule,
       two bindings crossing the top edge, and a 2 x 3 grid of filled date cells on even columns. The middle column
       (one cell per row) is the highlighted date in both. A level arrow between them points right. -->
  <g data-role="base">
    <rect id="frame-a" x="10.61" y="21.35" width="77.78" height="71.47" rx="3.5"/>
    <line id="header-a" x1="10.61" y1="40.9" x2="88.39" y2="40.9"/>
    <line id="binding-a-1" x1="29.03" y1="10.85" x2="29.03" y2="29.5"/>
    <line id="binding-a-2" x1="69.97" y1="10.85" x2="69.97" y2="29.5"/>
    <rect id="frame-b" x="142.51" y="21.35" width="77.78" height="71.47" rx="3.5"/>
    <line id="header-b" x1="142.51" y1="40.9" x2="220.29" y2="40.9"/>
    <line id="binding-b-1" x1="160.93" y1="10.85" x2="160.93" y2="29.5"/>
    <line id="binding-b-2" x1="201.87" y1="10.85" x2="201.87" y2="29.5"/>
    <rect id="date-a-11" class="fill" x="24.39" y="53.65" width="8.3" height="11.3" rx="2"/>
    <rect id="date-a-13" class="fill" x="66.31" y="53.65" width="8.3" height="11.3" rx="2"/>
    <rect id="date-a-21" class="fill" x="24.79" y="71.08" width="7.5" height="9.85" rx="2"/>
    <rect id="date-a-23" class="fill" x="66.71" y="71.08" width="7.5" height="9.85" rx="2"/>
    <rect id="date-b-11" class="fill" x="156.29" y="53.65" width="8.3" height="11.3" rx="2"/>
    <rect id="date-b-13" class="fill" x="198.21" y="53.65" width="8.3" height="11.3" rx="2"/>
    <rect id="date-b-21" class="fill" x="156.69" y="71.08" width="7.5" height="9.85" rx="2"/>
    <rect id="date-b-23" class="fill" x="198.61" y="71.08" width="7.5" height="9.85" rx="2"/>
  </g>
  <g data-role="accent">
    <rect id="date-a-12" class="fill" x="41.25" y="53.20" width="16.5" height="12.2" rx="2"/>
    <rect id="date-a-22" class="fill" x="43.15" y="71.03" width="12.7" height="9.95" rx="2"/>
    <rect id="date-b-12" class="fill" x="173.15" y="53.20" width="16.5" height="12.2" rx="2"/>
    <rect id="date-b-22" class="fill" x="175.05" y="71.03" width="12.7" height="9.95" rx="2"/>
    <line id="arrow-shaft" x1="101.25" y1="56.22" x2="130.3" y2="56.22"/>
    <polyline id="arrow-head" class="miter" points="120.09,44.87 130.3,56.22 120.09,67.57"/>
  </g>
</svg>
