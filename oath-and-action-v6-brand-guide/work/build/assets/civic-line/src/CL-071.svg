<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-071" viewBox="0 0 166 140">
  <!-- CL-071 Policy. Crop 166 x 140 px; ink box x 8..158, y 8..132.
       Construction: an upright page with three horizontal information rules. Near its lower portion, a horizontal adjustment rail begins inside the page and extends out to the right. A hollow circular knob sits on that rail near the page’s right edge. The page contour leaves a small opening around the slider exit.
       Red: the circular knob outline. Page, information rules and rail remain black. This has one low slider, distinct from Election Rules’ two-slider page. -->
  <!-- T4 trace. Page: plumb sides x 11.42 and 126.08, level top y 10.75 and bottom y 129.32, rounded corners;
       the right side stops at y 78.5 and the bottom at x 67.75, leaving the opening round the slider.
       Rules at y 33.15, 55.53, 77.91 (equal steps); rail at y 101.56 split by the knob, a true circle r 13.97. -->
  <g data-role="base">
    <path id="page" d="M126.08 78.5 V14.75 A4 4 0 0 0 122.08 10.75 H15.42 A4 4 0 0 0 11.42 14.75 V125.32 A4 4 0 0 0 15.42 129.32 H67.75"/>
    <line id="rule-1" x1="32.75" y1="33.15" x2="105.6" y2="33.15"/>
    <line id="rule-2" x1="32.75" y1="55.53" x2="105.6" y2="55.53"/>
    <line id="rule-3" x1="32.75" y1="77.91" x2="81.5" y2="77.91"/>
    <line id="rail-left" x1="32.75" y1="101.56" x2="76.25" y2="101.56"/>
    <line id="rail-right" x1="127.13" y1="101.56" x2="155" y2="101.56"/>
  </g>
  <g data-role="accent">
    <circle id="knob" cx="101.4" cy="101.5" r="13.97"/>
  </g>
</svg>
