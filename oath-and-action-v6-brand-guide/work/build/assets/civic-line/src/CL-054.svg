<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-054" viewBox="0 0 194 136">
  <!-- CL-054 Home Equity. Crop 194 x 136 px; ink box x 8..186, y 8..128.
       Construction: a large house at left/back with pitched roof, chimney and a plain rectangular doorway. A financial chart panel overlaps the right side. The chart contains three short ascending vertical bars at its bottom and a jagged rising arrow above them, pointing toward upper right.
       Red: the upward-right zigzag arrow. House, chart perimeter and bars remain black. Keep this chart drawing distinct from Household Security’s dollar-sign ledger.
       Trace: the roof (apex x 67.68) runs into the chart panel's left edge, which also closes the house
       at right; the house walls stop short below the roof and the chimney is an open outline above it.
       Arrow: one zigzag with parallel rising legs, and an L-shaped head with a square tip. -->
  <g data-role="base">
    <polyline id="roof" points="11.3,58.53 67.68,12.3 110.87,47.72"/>
    <polyline id="chimney" points="94.95,23.55 94.95,11.31 112.92,11.31 112.92,29.45"/>
    <path id="house" d="M23.5 58.75 V106.13 A3.9 3.9 0 0 0 27.4 110.03 H110.87"/>
    <polyline id="door" points="53.98,110.03 53.98,74.53 81.0,74.53 81.0,110.03"/>
    <path id="panel" d="M110.87 42.300000000000004 A4.6 4.6 0 0 1 115.47 37.7 H178.04 A4.6 4.6 0 0 1 182.64 42.300000000000004 V120.06 A4.6 4.6 0 0 1 178.04 124.66 H115.47 A4.6 4.6 0 0 1 110.87 120.06 Z"/>
    <line id="bar-1" x1="131.5" y1="101.0" x2="131.5" y2="110.25"/>
    <line id="bar-2" x1="147.63" y1="91.75" x2="147.63" y2="110.25"/>
    <line id="bar-3" x1="163.77" y1="80.5" x2="163.77" y2="110.25"/>
  </g>
