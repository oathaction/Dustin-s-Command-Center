    <rect id="cupola" x="83.8" y="24.6" width="13.8" height="9.73"/>
    <path id="dome" d="M61.31 61.75 A29.46 29.46 0 0 1 119.96 60.36 L119.96 70.7"/>
    <line id="dome-base" x1="61.44" y1="60.36" x2="119.96" y2="60.36"/>
