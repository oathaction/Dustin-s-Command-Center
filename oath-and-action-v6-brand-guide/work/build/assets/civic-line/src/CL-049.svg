<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-049" viewBox="0 0 178 134">
  <!-- CL-049 Wealth Concentration. Crop 178 x 134 px; ink box x 8..170, y 8..126.
       Construction: three cylindrical coin/asset stacks step upward from left to right. Each has a narrow elliptical top, parallel vertical sides and repeated curved horizontal bands. The left stack is short, the middle taller and the right tallest. Their bases sit along the same lower level while overlapping slightly.
       Red: the upper elliptical rim of the tallest right-hand stack. Other rims, sides and bands remain black. Count the bands in each source stack and retain the large differences in height.
       Trace: three separate stacks on one base line (lowest arcs bottom out at y 123.1). Every rim and band
       is the same ellipse shape per stack (ry 8.6, rx = the stack half-width); bands are lower half-ellipses
       spaced evenly within each stack. Counts below the rim: 3, 5 and 8 arcs. Red: upper half of the right rim,
       cut square 3.7 px down each side. -->
  <g data-role="base">
    <ellipse id="left-rim" cx="31.25" cy="88.09" rx="20.25" ry="8.6"/>
    <path id="left-band-1" d="M11 101.295 A20.25 8.6 0 0 0 51.5 101.295"/>
    <path id="left-band-2" d="M11 114.5 A20.25 8.6 0 0 0 51.5 114.5"/>
    <line id="left-side-left" x1="11" y1="88.09" x2="11" y2="114.5"/>
    <line id="left-side-right" x1="51.5" y1="88.09" x2="51.5" y2="114.5"/>
    <ellipse id="middle-rim" cx="84.5" cy="58.5" rx="21.35" ry="8.6"/>
    <path id="middle-band-1" d="M63.15 72.5 A21.35 8.6 0 0 0 105.85 72.5"/>
    <path id="middle-band-2" d="M63.15 86.5 A21.35 8.6 0 0 0 105.85 86.5"/>
    <path id="middle-band-3" d="M63.15 100.5 A21.35 8.6 0 0 0 105.85 100.5"/>
    <path id="middle-band-4" d="M63.15 114.5 A21.35 8.6 0 0 0 105.85 114.5"/>
    <line id="middle-side-left" x1="63.15" y1="58.5" x2="63.15" y2="114.5"/>
    <line id="middle-side-right" x1="105.85" y1="58.5" x2="105.85" y2="114.5"/>
    <path id="right-rim-lower" d="M117.9 19.28 A24.475 8.6 0 0 0 166.85 19.28"/>
    <path id="right-band-1" d="M117.9 32.883 A24.475 8.6 0 0 0 166.85 32.883"/>
    <path id="right-band-2" d="M117.9 46.486 A24.475 8.6 0 0 0 166.85 46.486"/>
    <path id="right-band-3" d="M117.9 60.089 A24.475 8.6 0 0 0 166.85 60.089"/>
    <path id="right-band-4" d="M117.9 73.692 A24.475 8.6 0 0 0 166.85 73.692"/>
    <path id="right-band-5" d="M117.9 87.295 A24.475 8.6 0 0 0 166.85 87.295"/>
    <path id="right-band-6" d="M117.9 100.898 A24.475 8.6 0 0 0 166.85 100.898"/>
    <path id="right-band-7" d="M117.9 114.5 A24.475 8.6 0 0 0 166.85 114.5"/>
    <line id="right-side-left" x1="117.9" y1="23" x2="117.9" y2="114.5"/>
    <line id="right-side-right" x1="166.85" y1="23" x2="166.85" y2="114.5"/>
  </g>
  <g data-role="accent">
    <path id="right-rim-upper" class="butt" d="M117.9 23 V19.28 A24.475 8.6 0 0 1 166.85 19.28 V23"/>
