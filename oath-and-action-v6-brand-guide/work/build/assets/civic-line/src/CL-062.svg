<svg xmlns="http://www.w3.org/2000/svg" data-id="CL-062" viewBox="0 0 198 127">
  <!-- CL-062 Assets & Debt. Crop 198 x 127 px; ink box x 8..190, y 8..119.
       Construction: two unequal cylindrical asset/coin stacks fill the left, with elliptical top rims and repeated curved bands. An upright debt record stands behind/right, with several information rules. A circular minus badge overlaps its lower-right corner, covering part of the page edge.
       Red: the badge’s circular border and short horizontal minus. Stacks, page and rules remain black. Keep the badge round, the minus horizontal and both asset stacks visible.
       Trace: two stacks side by side sharing one vertical edge (x 49.31); every rim and band is the same
       ellipse shape per stack (ry 8.2). Counts below the rim: short stack 3 arcs plus the rim's lower half,
       tall stack 6. The page's right and bottom edges stop short of the red badge. -->
  <g data-role="base">
    <ellipse id="short-rim" cx="30.355" cy="64.58" rx="18.955" ry="8.2"/>
    <path id="short-band-1" d="M11.4 78.133 A18.955 8.2 0 0 0 49.31 78.133"/>
    <path id="short-band-2" d="M11.4 91.686 A18.955 8.2 0 0 0 49.31 91.686"/>
    <path id="short-band-3" d="M11.4 105.239 A18.955 8.2 0 0 0 49.31 105.239"/>
    <line id="short-side" x1="11.4" y1="64.58" x2="11.4" y2="105.239"/>
    <ellipse id="tall-rim" cx="70.185" cy="27.32" rx="20.875" ry="8.2"/>
    <path id="tall-band-1" d="M49.31 40.785 A20.875 8.2 0 0 0 91.06 40.785"/>
    <path id="tall-band-2" d="M49.31 54.25 A20.875 8.2 0 0 0 91.06 54.25"/>
    <path id="tall-band-3" d="M49.31 67.715 A20.875 8.2 0 0 0 91.06 67.715"/>
    <path id="tall-band-4" d="M49.31 81.18 A20.875 8.2 0 0 0 91.06 81.18"/>
    <path id="tall-band-5" d="M49.31 94.645 A20.875 8.2 0 0 0 91.06 94.645"/>
    <path id="tall-band-6" d="M49.31 108.11 A20.875 8.2 0 0 0 91.06 108.11"/>
    <line id="tall-side-left" x1="49.31" y1="27.32" x2="49.31" y2="108.11"/>
    <line id="tall-side-right" x1="91.06" y1="27.32" x2="91.06" y2="108.11"/>
    <path id="page" d="M187.12 66.75 V14.34 A3.7 3.7 0 0 0 183.42 10.64 H110.83 A3.7 3.7 0 0 0 107.13 14.34 V96.88 A3.7 3.7 0 0 0 110.83 100.58 H142.85"/>
    <line id="rule-1" x1="124.5" y1="29.06" x2="169.75" y2="29.06"/>
    <line id="rule-2" x1="124.5" y1="46.48" x2="169.75" y2="46.48"/>
    <line id="rule-3" x1="124.5" y1="63.89" x2="142.25" y2="63.89"/>
    <line id="rule-4" x1="124.5" y1="81.31" x2="133.25" y2="81.31"/>
  </g>
  <g data-role="accent">
    <circle id="badge" cx="167.47" cy="83.29" r="18.1"/>
    <line id="badge-minus" x1="159.67" y1="83.29" x2="175.27" y2="83.29"/>
  </g>
</svg>
