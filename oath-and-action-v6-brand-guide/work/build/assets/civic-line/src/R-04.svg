    <polyline id="boundary-across" class="butt" points="7.68,71.29 37.99,69.86 47.63,58.06 65.5,58.06 70.3,52.85 78.44,52.8 85.73,53.39 90.65,58.45 99.13,58.94 104.34,52.94 117.42,52.94 119.12,75.95 147.6,75.95"/>
