<svg xmlns="http://www.w3.org/2000/svg" data-id="R-43" viewBox="0 0 152 137">
  <!-- R-43 Disaster Mitigation. Crop 152 x 137 px; ink box x 8..144, y 8..129.
       Construction: a pitched-roof home stands beneath a rounded storm cloud. Short diagonal rain strokes fall around its roof. Several wavy horizontal flood lines run beneath and across its lower area. The house has a simple doorway/window and a reinforced-looking broad roof segment on one slope.
       Red: the broad diagonal roof segment on the house's right-facing roof slope. House remainder, rain, cloud and flood waves stay black. Preserve the source's specific reinforced roof orientation.
       Cloud: four circular lobes meeting at cusps over a flat base. Rain: eight streaks (two leaning left
       at 118 degrees, six leaning right at 57.5 degrees) and two short drops, each kept at its drawn place.
       Layering follows the red sheet: the red roof band lies over the top of the left slope at the peak,
       and the black eave and wall lie over the band's foot, so the base is split into two groups.
       Flood: two equal cosine waves, period 28 px, in phase, 13.45 px apart. -->
