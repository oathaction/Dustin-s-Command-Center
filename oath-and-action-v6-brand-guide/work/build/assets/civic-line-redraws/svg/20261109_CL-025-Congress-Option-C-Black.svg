  <title>Congress, option C</title>
  <desc>Oath &amp; Action Civic Line CL-025 Congress, stage B redraw, option C, outside DR-135. The chamber from the rostrum: members face the reader from two curved benches, and the presiding desk stands red in the foreground. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
