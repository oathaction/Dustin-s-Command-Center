  <title>Agency Independence, option B</title>
  <desc>Oath &amp; Action Civic Line R-48 Agency Independence, stage B redraw, option B, outside DR-135. A flat-roofed office building with no columns or pediment, the red brace, and the official at a desk whose arrow stops at it. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
