  <title>Credit Allocation, option C</title>
  <desc>Oath &amp; Action Civic Line CL-059 Credit Allocation, stage B redraw, option C, outside DR-135. The bank becomes its safe, a strongbox on feet with a dial and handle; the red branches carry the money out. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
