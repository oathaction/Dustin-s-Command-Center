  <title>Agency Independence, option A</title>
  <desc>Oath &amp; Action Civic Line R-48 Agency Independence, stage B option A (within DR-135 where it applies). The four bays of columns become one wall with a door and two windows. Pediment, band, base, brace and official kept. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
