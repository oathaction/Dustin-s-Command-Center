  <title>Congressional Tariff Votes, option A</title>
  <desc>Oath &amp; Action Civic Line R-42 Congressional Tariff Votes, stage B redraw, option A, within DR-135. Finial, lantern and dome go, leaving the drum as a flat attic; the columns become a band and windows. Ballot box, chart and red kept. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
