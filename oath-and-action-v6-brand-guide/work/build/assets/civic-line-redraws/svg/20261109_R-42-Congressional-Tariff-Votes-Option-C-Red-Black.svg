  <desc>Oath &amp; Action Civic Line R-42 Congressional Tariff Votes, stage B redraw, option C, outside DR-135. Set C's two chambers, a red vote card with a yes and a no in place of the ballot box, and CL-064's parcel with a tag for imports. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
