  <desc>Oath &amp; Action Civic Line CL-014 Entrenched Power, stage B redraw, option A, within DR-135. Spire, cupola and dome become set A's flat attic; the six columns become two walls. Fence and red door kept. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
