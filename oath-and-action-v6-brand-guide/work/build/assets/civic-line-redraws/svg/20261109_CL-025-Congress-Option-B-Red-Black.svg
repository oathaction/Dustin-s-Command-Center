  <title>Congress, option B</title>
  <desc>Oath &amp; Action Civic Line CL-025 Congress, stage B redraw, option B, outside DR-135. The chamber in session from the gallery: five members on the near bench seen from behind, a far bench in five sections, and the three-tier rostrum with its top tier red. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
