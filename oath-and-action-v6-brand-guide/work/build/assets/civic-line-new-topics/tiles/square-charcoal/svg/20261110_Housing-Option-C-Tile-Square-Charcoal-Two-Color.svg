  <title>Housing</title>
  <desc>Oath &amp; Action Civic Line Housing-Option-C Housing: square tile in Charcoal, Newsprint lines with a Pillar Red accent. The icon is its bare export scaled by 0.748 about the center of the 128 box, with every stroke width multiplied by 0.9091 so its line stays at 3.3508 units or less. The tile shape has data-part 'tile' and the icon group data-part 'icon'.</desc>
