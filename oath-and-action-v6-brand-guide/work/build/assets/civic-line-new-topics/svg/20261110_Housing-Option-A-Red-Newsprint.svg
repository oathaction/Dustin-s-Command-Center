  <title>Housing, option A</title>
  <desc>Oath &amp;amp; Action Civic Line, Housing, new topic drawing (DR-196), option A. Homes of more than one kind: a flat-roofed apartment block and a pitched-roof house on one ground line; red on one window of the block. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts. For approval by name on drawings board C.</desc>
