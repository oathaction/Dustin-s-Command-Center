  <desc>Oath &amp; Action Civic Line NT-01 Testify, stage B option C (outside DR-135 where it applies). The raised, curved dais with three officials, and the red microphone on the witness table; the reader is the witness. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
