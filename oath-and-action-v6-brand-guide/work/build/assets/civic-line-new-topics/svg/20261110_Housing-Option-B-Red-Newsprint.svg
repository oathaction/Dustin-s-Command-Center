  <title>Housing, option B</title>
  <desc>Oath &amp;amp; Action Civic Line, Housing, new topic drawing (DR-196), option B. An apartment house: three floors under a pitched roof, two windows a floor; red on the arched door. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts. For approval by name on drawings board C.</desc>
