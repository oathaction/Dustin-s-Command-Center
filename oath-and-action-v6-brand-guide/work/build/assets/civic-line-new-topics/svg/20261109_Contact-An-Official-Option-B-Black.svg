  <title>Contact An Official, option B</title>
  <desc>Oath &amp; Action Civic Line Contact An Official, new topic drawing (DR-141, DR-147), option B. A very simple phone, a step larger, whose red cord runs to an official at a desk. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts.</desc>
