  <title>Housing, option B</title>
  <desc>Oath &amp; Action Civic Line, Housing, new topic drawing (DR-196), option B. Two homes under one roof: three floors under a pitched roof, two square-headed doors side by side with a column of two windows over each; red on the left door. Drawn in Civic Line's hand: one line weight, round caps and joins, one red accent, the capped fit of DR-08. The group with data-part 'accent' holds the red parts. For approval by name on drawings board C.</desc>
