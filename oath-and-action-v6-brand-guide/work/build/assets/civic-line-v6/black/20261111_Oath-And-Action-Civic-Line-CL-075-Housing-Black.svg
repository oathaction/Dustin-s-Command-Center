<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="oa-civic-line-cl-075-black" data-id="CL-075" width="128" height="128" viewBox="0 0 128 128">
  <title>Housing</title>
  <desc>Oath &amp; Action Civic Line CL-075 Housing. An apartment block of three floors beside a pitched-roof house on one ground line, red on one window of the block: homes of more than one kind, renters' and owners' alike. The final drawing, approved by name on drawings board C as option A (DR-207) and put into use on November 11, 2026. A new topic drawing, numbered CL-075 (D2-1262) and filed with sheet 03, Economy &amp; Public Issues. It is set at 48 px and up and stays off the list of drawings set at 24 px (D2-1238). Drawn in Civic Line's hand: one line weight, round caps and joins, the capped fit of DR-08. The group with data-part 'base' is the main drawing; the group with data-part 'accent' holds the accent parts, red in the two-color editions. Every id in the file starts with the file's root id.</desc>
