  <title>Contact an Official</title>
  <desc>Oath &amp; Action Civic Line CL-074 Contact an Official. A person and an official at a desk, joined by one line that carries a red speech mark. The final drawing, approved by name on the stage B drawings board as option A (DR-160) and promoted to the set in use on November 10, 2026. A new topic drawing, numbered and filed with sheet 01, Participation (D2-714). Drawn in Civic Line's hand: one line weight, round caps and joins, the capped fit of DR-08. The group with data-part 'base' is the main drawing; the group with data-part 'accent' holds the accent parts, red in the two-color editions. Every id in the file starts with the file's root id.</desc>
