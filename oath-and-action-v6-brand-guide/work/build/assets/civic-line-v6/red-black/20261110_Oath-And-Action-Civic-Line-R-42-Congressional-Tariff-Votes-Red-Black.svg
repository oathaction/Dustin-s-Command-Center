<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="oa-civic-line-r-42-red-black" data-id="R-42" width="128" height="128" viewBox="0 0 128 128">
  <title>Congressional Tariff Votes</title>
  <desc>Oath &amp; Action Civic Line R-42 Congressional Tariff Votes. The House chamber in session, seen from the gallery, above a red vote card with a yes and a no and a parcel with a tag for imports. The final drawing, approved by name on the stage B drawings board as set B (DR-156) and promoted to the set in use on November 10, 2026. It replaces the October master in the set in use, and the October master stays in the October set as the record (D2-464, D2-716). Drawn in Civic Line's hand: one line weight, round caps and joins, the capped fit of DR-08. The group with data-part 'base' is the main drawing; the group with data-part 'accent' holds the accent parts, red in the two-color editions. Every id in the file starts with the file's root id.</desc>
