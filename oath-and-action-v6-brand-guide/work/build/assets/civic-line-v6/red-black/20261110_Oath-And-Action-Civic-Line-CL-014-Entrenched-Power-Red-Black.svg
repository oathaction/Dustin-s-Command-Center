  <title>Entrenched Power</title>
  <desc>Oath &amp; Action Civic Line CL-014 Entrenched Power. A ballot's arrow runs at the fenced chamber and stops at the fence on a red bar, so an election cannot move the body. The final drawing, approved by name on the stage B drawings board as option C (DR-156) and promoted to the set in use on November 10, 2026. It replaces the October master in the set in use, and the October master stays in the October set as the record (D2-464, D2-716). Drawn in Civic Line's hand: one line weight, round caps and joins, the capped fit of DR-08. The group with data-part 'base' is the main drawing; the group with data-part 'accent' holds the accent parts, red in the two-color editions. Every id in the file starts with the file's root id.</desc>
