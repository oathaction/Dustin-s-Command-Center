<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="oa-civic-line-r-48-newsprint" data-id="R-48" width="128" height="128" viewBox="0 0 128 128">
  <title>Agency Independence</title>
  <desc>Oath &amp; Action Civic Line R-48 Agency Independence. The commission at its table and the official at a desk, whose arrow stops at the red brace. The final drawing, approved by name on the stage B drawings board as option C (DR-158) and promoted to the set in use on November 10, 2026. It replaces the October master in the set in use, and the October master stays in the October set as the record (D2-464, D2-716). Drawn in Civic Line's hand: one line weight, round caps and joins, the capped fit of DR-08. The group with data-part 'base' is the main drawing; the group with data-part 'accent' holds the accent parts, red in the two-color editions. Every id in the file starts with the file's root id.</desc>
