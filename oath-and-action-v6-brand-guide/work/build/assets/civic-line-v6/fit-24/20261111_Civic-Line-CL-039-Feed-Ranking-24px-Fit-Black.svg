<svg xmlns="http://www.w3.org/2000/svg" id="oa-civic-line-cl-039-24px-fit-black" data-id="CL-039" data-size="24" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <title>Feed Ranking</title>
  <desc>Oath &amp; Action Civic Line CL-039 Feed Ranking, the 24 px pixel fit in use: drawn pixel by pixel on the 24 px grid with a one-pixel line, every pixel Charcoal or empty, keeping the parts that make its master read. One color, the black edition only (D2-1132). Use it at 24 px on 1x screens; from 2x the master draws instead, the pillar icons' switch (DR-179). Approved by name on drawings board C (DR-209) and put into use on November 11, 2026.</desc>
