  <title>Market Power</title>
  <desc>Oath &amp; Action Civic Line CL-051 Market Power, the 24 px pixel fit: drawn pixel by pixel on the 24 px grid with a one-pixel line, every pixel Charcoal or empty, keeping the parts that make its master read (DR-198, DR-205). One color, the black edition only (D2-1132). Use at 24 px on 1x screens; from 2x the master draws instead (DR-179's switch). For approval by name on drawings board C; not in use until Dustin approves it.</desc>
