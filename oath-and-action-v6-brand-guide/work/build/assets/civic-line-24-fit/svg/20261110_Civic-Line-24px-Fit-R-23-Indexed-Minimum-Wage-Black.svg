<svg xmlns="http://www.w3.org/2000/svg" id="oa-civic-line-24-fit-r-23-black" data-id="R-23" data-size="24" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <title>Indexed Minimum Wage</title>
  <desc>Oath &amp; Action Civic Line R-23 Indexed Minimum Wage, the 24 px pixel fit: drawn pixel by pixel on the 24 px grid with a one-pixel line, every pixel Charcoal or empty, keeping the parts that make its master read (DR-198, DR-205). One color, the black edition only (D2-1132). Use at 24 px on 1x screens; from 2x the master draws instead (DR-179's switch). For approval by name on drawings board C; not in use until Dustin approves it.</desc>
