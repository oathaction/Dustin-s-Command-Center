<title>Reader Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A short phone test of draft designs for a civic publication.">
<meta name="chart-views" content="welcome">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: one calm reading column, one question per screen. Stimuli sit inside the 16 px gutter at the phone size
   they were drawn for, never scaled up. A single light look on purpose: every reader sees the stimuli on the same
   Newsprint ground, whatever their phone's theme. (The second check, November 10, 2026, from the first check's page.) */
:root {
  --newsprint: #DCD9D2;   /* page ground (locked palette) */
  --ink: #121212;         /* Charcoal: text, selected answers, primary buttons; 13.29:1 on Newsprint */
  --ink-2: #4E535B;       /* Deep Stone: secondary text, 5.49:1 on Newsprint */
  --rule: #5D636D;        /* Stone: control borders and hairlines, 4.29:1 on Newsprint */
  --track: #C4C1BB;       /* progress track: Newsprint 12% toward Charcoal in sRGB, decorative */
  --ink-hover: #252525;   /* primary button hover: Charcoal 8% toward White in sRGB */
  --press: #D0CDC6;       /* hover and press: Newsprint 6% toward Charcoal in sRGB */
  --field: #FFFFFF;       /* White: text fields */
  --on-ink-2: #A3A19C;    /* Dim Newsprint: secondary text on Charcoal, 7.26:1 */
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --col: 34rem;
  --tap: 48px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--newsprint); color: var(--ink); font: 400 17px/1.5 var(--font-text); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--newsprint); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: var(--col); margin: 0 auto; }

/* header: what this is, where you are, and during a look, the time left */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--newsprint); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 12px 9px; }
.bar-title, .bar-step { font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.bar-step { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-step.timing { color: var(--ink); }
.rail { display: flex; gap: 3px; height: 3px; margin-bottom: 10px; }
.rail span { flex: 1; background: var(--track); }
.rail span.done { background: var(--ink); }
.clock { height: 3px; margin-bottom: 10px; background: var(--track); }
.clock-fill { height: 100%; width: 100%; background: var(--ink); }

main { display: block; padding-block: 28px 64px; outline: none; }
.screen { display: flex; flex-direction: column; gap: 18px; }
.screen > * { margin: 0; }
h1, h2 { font-family: var(--font-head); font-weight: 700; letter-spacing: -0.012em; text-wrap: balance; margin: 0; outline: none; }
h1 { font-size: 32px; line-height: 1.1; }
h2 { font-size: 25px; line-height: 1.2; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-family: var(--font-text); font-variant-numeric: tabular-nums; }
h2.eyebrow { letter-spacing: .07em; }
p { margin: 0; max-width: 62ch; }
.hint { font-size: 15px; color: var(--ink-2); margin-top: -8px; }
.hint.tight { margin-top: -12px; }
.note { font-size: 15px; font-weight: 600; padding: 10px 12px; border: 1px solid var(--rule); background: var(--press); }
.mode { font-size: 15px; font-weight: 500; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: 3px; font: 600 17px/1.2 var(--font-text); cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
.btn.primary { background: var(--ink); color: var(--newsprint); border: 1px solid var(--ink); }
.btn.primary:hover { background: var(--ink-hover); }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--ink); min-height: 44px; font-size: 15px; padding: 0 16px; }
.btn.line:hover { background: var(--press); }
.btn.text { background: transparent; color: var(--ink-2); border: 0; min-height: 44px; padding: 0 4px; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.btn.text:hover { color: var(--ink); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .choice:has(input:focus-visible), .seg label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.again { align-self: flex-start; }
.actions { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-top: 6px; }
.actions .btn.text { align-self: center; }
@media (min-width: 600px) {
  .actions { flex-direction: row; align-items: center; gap: 20px; }
  .actions .btn.primary { min-width: 12rem; }
}
label.field { font-weight: 600; font-size: 15px; display: block; margin-bottom: 6px; }
input[type="text"], textarea { width: 100%; font: 400 17px/1.4 var(--font-text); color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 3px; padding: 12px; }
textarea { min-height: 7.5em; resize: vertical; }
.msg { font-size: 15px; font-weight: 600; padding-left: 10px; border-left: 3px solid var(--ink); }
.msg:empty { height: 0; padding: 0; border: 0; margin-top: -14px; }
form { display: flex; flex-direction: column; gap: 14px; margin: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* answer choices: the selected one fills with ink and its ring takes a check, so the state shows by shape too */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 11px 14px; border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; background: transparent; -webkit-tap-highlight-color: transparent; }
.choice:hover { background: var(--press); }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.dot { flex: none; width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
.dot svg { width: 14px; height: 14px; opacity: 0; }
.ct { display: flex; flex-direction: column; min-width: 0; }
.cl { font-weight: 500; }
.cs { font-size: 15px; color: var(--ink-2); line-height: 1.35; }
.choice.on, .choice:has(input:checked) { background: var(--ink); color: var(--newsprint); border-color: var(--ink); }
.choice.on .dot, .choice:has(input:checked) .dot { border-color: var(--newsprint); background: var(--newsprint); }
.choice.on .dot svg, .choice:has(input:checked) .dot svg { opacity: 1; }
.choice.on .cs, .choice:has(input:checked) .cs { color: var(--on-ink-2); }
.arrow { padding: 0 .3em; }

/* the stimuli */
.stage { display: flex; justify-content: center; }
.stage img { display: block; max-width: 100%; height: auto; }
.stage-chart { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 14px; }
.stage-icon { min-height: 280px; align-items: center; }
.stage-icon img { width: 48px; height: 48px; }
.stage-big { min-height: 280px; align-items: center; }
.stage-big img { width: 96px; height: 96px; }
.stage-card { padding-block: 24px; }
.stage-left { justify-content: flex-start; }
/* the list of bills is 360 px wide, so on a phone it may use the gutters to show at its own size */
.stage-bleed { margin-inline: -16px; }
@media (min-width: 600px) { .stage-bleed { margin-inline: 0; } }
.cap { font-size: 15px; font-weight: 600; }
.sheet { display: grid; grid-template-columns: repeat(4, max-content); justify-content: start; align-items: end; gap: 30px clamp(12px, calc((100vw - 260px) / 4), 28px); padding-block: 30px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.sheet-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.sheet-cell img, .rate-mark img, .rowx img, .foot img, .ending img { max-width: none; }
.sheet-n { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1; }
.loading { min-height: 200px; display: grid; place-items: center; font-size: 15px; color: var(--ink-2); }

/* the two rows of four drawings, as the guide sets them: 24 px in one line that wraps, 48 px stacked in one column */
.rowx { list-style: none; margin: 0; padding: 18px 0; display: flex; flex-wrap: wrap; align-items: center; row-gap: 12px; width: 100%; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.rowx li { display: flex; align-items: center; gap: 8px; }
.rowx li img { display: block; flex: none; }
.rowx li:not(:last-child)::after { content: "→" / ""; color: var(--ink-2); font: 400 17px/1.6 var(--font-text); margin: 0 14px 0 2px; }
.rowx .w { font: 400 17px/1.6 var(--font-text); }
.rowx .now .w { font-weight: 700; text-decoration: underline solid 2px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
.rowx.big { flex-direction: column; align-items: flex-start; }
.rowx.big li { gap: 12px; }
.rowx.big li:not(:last-child)::after { content: "↓" / ""; margin: 0 0 0 4px; }
.rowx.big .w { font: 700 22px/1.5 var(--font-text); }

/* the bottom of a page */
.foot { width: 100%; display: flex; align-items: center; gap: 12px; padding: 18px 0 22px; border-top: 2px solid var(--ink); font-size: 15px; color: var(--ink-2); }
.foot img { display: block; flex: none; }

/* the end of an article: the mark half an em after the period, the pixel drawing at exactly 1x, the smooth one elsewhere */
.ending { width: 100%; padding: 22px 0 24px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--ink); font-family: var(--font-text); font-weight: 400; line-height: 1.6; letter-spacing: 0; }
.ending p { max-width: none; }
.ending .nw { white-space: nowrap; }
.ending img { display: inline-block; margin-left: 0.5em; }
.ending .tf { display: none; }
.ending .ts { display: inline-block; }
@media (resolution: 1dppx), (-webkit-device-pixel-ratio: 1) { .ending .tf { display: inline-block; } .ending .ts { display: none; } }

/* sentence pairs */
.pair { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.pair-item { display: grid; grid-template-columns: 2rem 1fr; gap: 4px 10px; padding-block: 16px; border-bottom: 1px solid var(--rule); }
.pair-k { font: 700 22px/1.2 var(--font-head); }
.pair-s { font-size: 19px; line-height: 1.45; }

/* the small marks' rating rows */
.rates { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.rate { display: grid; gap: 10px; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.rate legend { float: left; width: 100%; padding: 0; font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.rate legend + * { clear: both; }
.rate-mark { min-height: 16px; display: flex; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg label { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 6px; border: 1px solid var(--rule); border-radius: 3px; font-size: 15px; font-weight: 500; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.seg label:hover { background: var(--press); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.seg svg { width: 13px; height: 13px; display: none; flex: none; }
.seg label.on, .seg label:has(input:checked) { background: var(--ink); color: var(--newsprint); border-color: var(--ink); }
.seg label.on svg, .seg label:has(input:checked) svg { display: block; }

/* the end */
.copy textarea { min-height: 14em; font-size: 15px; line-height: 1.45; }
.status { font-size: 15px; font-weight: 600; }
.status:empty { height: 0; margin-top: -18px; }

@media (min-width: 600px) {
  main { padding-block: 44px 80px; }
  h1 { font-size: 38px; }
  h2 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .clock { display: none; }
}
/* forced colors: the system palette drops backgrounds, so the rail and clock draw in its text color, and a chosen
   answer takes a heavier border beside its check */
@media (forced-colors: active) {
  .rail span.done, .clock-fill { forced-color-adjust: none; background: CanvasText; }
  .rail span, .clock { forced-color-adjust: none; background: GrayText; }
  .choice.on, .choice:has(input:checked), .seg label.on, .seg label:has(input:checked) { border-width: 3px; }
}
</style>

<header class="bar" id="bar">
  <div class="gut"><div class="col">
    <div class="bar-in"><span class="bar-title">Draft design test</span><span class="bar-step" id="bar-step">Step 1 of 11</span></div>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div class="clock" id="clock" aria-hidden="true" hidden><div class="clock-fill" id="clock-fill"></div></div>
  </div></div>
</header>
<main id="app" class="gut" tabindex="-1">
  <div class="col">
    <section class="screen" data-view-root="welcome">
      <h1>A short test of a draft design</h1>
      <p>This test needs JavaScript. If nothing changes in a moment, open the link in your phone's browser.</p>
    </section>
  </div>
</main>

<script>
(() => {
'use strict';
document.documentElement.lang = 'en';
const CONFIG = /*CONFIG*/{};
const TEST = (window.__RC_TEST__ && typeof window.__RC_TEST__ === 'object') ? window.__RC_TEST__ : {};
const SCALE = typeof TEST.timeScale === 'number' && TEST.timeScale > 0 ? TEST.timeScale : 1;
const SNAP_KEY = 'reader-check-2:' + CONFIG.version;
const SCHEMA = 'reader-check-2/1';
const STEPS = 11;

// ------------------------------------------------------------------ small helpers
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function check() {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 14 14'); s.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M2.5 7.4 5.6 10.4 11.6 3.8'); p.setAttribute('fill', 'none');
  p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '2.2'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
  s.append(p); return s;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function within(p, ms) {
  return new Promise((res, rej) => { const t = setTimeout(() => rej({ code: 'timeout' }), ms); Promise.resolve(p).then((v) => { clearTimeout(t); res(v); }, (e) => { clearTimeout(t); rej(e); }); });
}
function rand(n) { const a = new Uint32Array(1); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : (a[0] = Math.floor(Math.random() * 4294967296)); return a[0] % n; }
function shuffle(xs) { const a = xs.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newId() { let s = 'run-'; for (let i = 0; i < 12; i++) s += 'abcdefghijkmnpqrstuvwxyz23456789'[rand(32)]; return s; }
const now = () => new Date().toISOString();
const listWords = (xs) => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
function readSnap() { try { const s = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null'); return s && s.run && s.version === CONFIG.version ? s : null; } catch (e) { return null; } }
function writeSnap() { try { localStorage.setItem(SNAP_KEY, JSON.stringify({ version: CONFIG.version, runId: S.runId, run: S.run, pos: S.pos, savedOk: Store.finalOk })); } catch (e) { /* storage blocked: the test still runs */ } }
function clearSnap() { try { localStorage.removeItem(SNAP_KEY); } catch (e) { /* nothing to clear */ } }

// A clock that counts only while the page is visible and not paused.
function stopwatch() {
  let total = 0, since = null, paused = false;
  const live = () => !paused && document.visibilityState !== 'hidden';
  const sync = () => { const t = performance.now(); if (since !== null) total += t - since; since = live() ? t : null; };
  sync();
  const onVis = () => sync();
  document.addEventListener('visibilitychange', onVis);
  return {
    ms() { sync(); return total; },
    pause() { sync(); paused = true; sync(); },
    resume() { paused = false; sync(); },
    stop() { sync(); document.removeEventListener('visibilitychange', onVis); return total; },
  };
}

// ------------------------------------------------------------------ saving: the db when this view has it, else copy
const Store = {
  mode: 'checking', note: '', db: null, ref: null, exists: null, inflight: null, dirty: false, everOk: false, finalOk: false,
  ready: null,
  init() { this.ready = this._init().catch(() => this.setMode('copy', 'error during setup')); return this.ready; },
  async _init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return this.setMode('copy', 'no viewer');
    const use = (name) => within(c.use(name), 11000).catch(() => null);
    const [db, user] = await Promise.all([use('db'), use('user')]);
    if (!db) return this.setMode('copy', 'db unavailable');
    if (!user) return this.setMode('copy', 'user unavailable');
    const uid = await within(user.id(), 10000).catch(() => null);
    if (!uid) return this.setMode('copy', 'no viewer id');
    const can = await within(user.can('data.write'), 10000).catch(() => null);
    if (can === false) return this.setMode('copy', 'view-only access');
    try { this.ref = db.doc('responses/' + uid); } catch (e) { return this.setMode('copy', 'bad path'); }
    this.db = db;
    try { const snap = await within(this.ref.get(), 10000); this.exists = !!snap.exists; } catch (e) { this.exists = null; }
    this.setMode('saved', '');
  },
  setMode(mode, note) {
    const was = this.mode;
    this.mode = mode; this.note = note || '';
    if (S.run && (S.run.mode !== mode)) { S.run.mode = mode; S.run.mode_note = this.note; }
    if (was === 'saved' && mode === 'copy') S.notice = 'This page can’t save your answers here, so at the end it will show them for you to copy and send.';
    if (was === 'checking' && mode === 'copy' && S.run) S.notice = 'This page can’t save answers for you here, so at the end it will show them for you to copy and send.';
    UI.modeChanged();
  },
  payload() { return { schema: SCHEMA, latest_run: S.runId, updated_at: now(), runs: { [S.runId]: S.run } }; },
  // One write at a time to the reader's document; a change during a write waits and goes next.
  save() {
    if (this.mode !== 'saved' || !S.run) return Promise.resolve();
    if (this.inflight) { this.dirty = true; return this.inflight; }
    this.dirty = false;
    this.inflight = (async () => {
      try { await this.writeOnce(this.payload()); this.everOk = true; }
      catch (e) { this.failed(e); }
      this.inflight = null;
      if (this.dirty && this.mode === 'saved') return this.save();
    })();
    return this.inflight;
  },
  async writeOnce(body) {
    const limit = this.everOk ? 20000 : 10000;
    if (this.exists === false) { await within(this.ref.set(body), limit); this.exists = true; return; }
    try { await within(this.ref.update(body), limit); this.exists = true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' && this.exists !== true) { await within(this.ref.set(body), limit); this.exists = true; return; }
      if (code === 'unavailable') { await sleep(700 + rand(1300)); await within(this.ref.update(body), limit); this.exists = true; return; }
      throw e;
    }
  },
  failed(e) {
    const code = (e && e.code) || 'unknown';
    if (code === 'resource_exhausted') { this.dirty = true; return; }   // try again with the next answer
    this.setMode('copy', 'write failed: ' + code);
  },
};

// ------------------------------------------------------------------ the run and its screens
const S = { runId: null, run: null, screens: [], pos: 0, notice: '', drafts: {}, watch: null, timer: null };
const EXP = CONFIG.exposure;
const LOOP_Q = {
  comes_back: { title: 'Do the arrows come back to where they started?', choices: [['yes', 'Yes'], ['no', 'No'], ['unsure', 'Not sure']] },
  feeds_or_pushes: { title: 'Does it feed itself or push back?', choices: [['feeds', 'It feeds itself', 'Each change builds on the one before.'], ['pushes', 'It pushes back', 'Each change works against the one before.'], ['unsure', 'Not sure']] },
};
const UNSURE = ['unsure', 'Not sure'];
const FAVORS = [['no', 'No'], ['left', 'Yes, the left'], ['right', 'Yes, the right'], UNSURE];
// The questions whose first choices shuffle per reader (the number says how many), with "Not sure" kept last.
const Q = {
  'house:red': { n: 4, choices: [['added', 'Seats being added'], ['party', 'Seats one party holds'], ['leaders', 'Seats for the leaders'], ['empty', 'Empty seats'], UNSURE] },
  'row_48:red': { n: 4, choices: [['current', 'It marks the one this section belongs to'], ['warning', 'It warns of a problem'], ['party', 'It shows a party or side'], ['decoration', 'It’s there for decoration'], UNSURE] },
  'steps_slash:meaning': { n: 4, choices: [['skipped', 'That step was skipped and never happened'], ['failed', 'That step failed'], ['done', 'That step is done'], ['now', 'That step is happening now'], UNSURE] },
  'steps_square:meaning': { n: 4, choices: [['stopped', 'The bill stopped there'], ['law', 'The bill became law'], ['waiting', 'The bill is waiting at that step'], ['skipped', 'That step was skipped'], UNSURE] },
  'steps_dot:meaning': { n: 4, choices: [['take_part', 'You can take part at this step now'], ['error', 'Something went wrong at this step'], ['late', 'This step is running late'], ['party', 'It marks one party'], UNSURE] },

// ------------------------------------------------------------------ UI shell
const UI = {
  stepEl: null, rail: null, clock: null, fill: null,
  setup() {
    this.stepEl = $('#bar-step'); this.rail = $('#rail'); this.clock = $('#clock'); this.fill = $('#clock-fill');
    for (let i = 0; i < STEPS; i++) this.rail.append(h('span'));
  },
  step(n) {
    this.stepEl.textContent = `Step ${n} of ${STEPS}`; this.stepEl.classList.remove('timing');
    [...this.rail.children].forEach((s, i) => s.classList.toggle('done', i < n));
    this.rail.hidden = false; this.clock.hidden = true;
  },
  timing(secondsLeft, frac) {
    this.stepEl.textContent = secondsLeft === 1 ? '1 second left' : `${secondsLeft} seconds left`;
    this.stepEl.classList.add('timing');
    this.rail.hidden = true; this.clock.hidden = false; this.fill.style.width = (Math.max(0, frac) * 100).toFixed(2) + '%';
  },
  modeChanged() {
    const el = $('#mode-line'); if (!el) return;
    el.className = 'mode ' + Store.mode;
    el.textContent = Store.mode === 'saved' ? 'This page saves your answers as you go.'
      : Store.mode === 'copy' ? 'This page can’t save answers for you here, so at the end it will show your answers for you to copy and send to the person who shared the link.'
      : 'Checking whether this page can save your answers as you go.';
  },
  mount(screenEl, focusEl) {
    const app = $('#app');
    const col = h('div', { class: 'col' }, screenEl);
    app.replaceChildren(col);
    window.scrollTo(0, 0);
    const f = focusEl || screenEl.querySelector('h1, h2');
    if (f) { f.setAttribute('tabindex', '-1'); f.focus({ preventScroll: true }); }
  },
};

// ------------------------------------------------------------------ navigation
function go(i) {
  if (S.timer) { S.timer.cancel(); S.timer = null; }
  if (S.watch) { S.watch.stop(); S.watch = null; }
  S.pos = i;
  const sc = S.screens[i];
  if (S.run) { S.run.position = sc.key; writeSnap(); }
  UI.step(sc.step);
  ({ welcome: renderWelcome, ready: renderReady, expose: (s) => renderExpose(s, false), question: renderQuestion, marks: renderMarks, pair: renderPair, end: renderEnd })[sc.kind](sc);
}
// A follow-up question shows only after the answers that call for it.
function next() {
  let i = S.pos + 1;
  while (i < S.screens.length - 1 && S.screens[i].when && !S.screens[i].when(S.run)) i++;
  go(i);
}
function takeNotice() { const n = S.notice; S.notice = ''; return n ? h('p', { class: 'note', role: 'status', text: n }) : null; }

// ------------------------------------------------------------------ welcome
function renderWelcome() {
  const snap = readSnap();
  const sec = h('section', { class: 'screen', 'data-view-root': 'welcome' });
  sec.append(
    h('h1', { text: 'A short test of a draft design' }),
    h('p', { text: 'We’re trying out a draft design for a civic publication, and we’d like your first impressions. You’ll look at some drawings, symbols, charts, sentences and small parts of pages and answer quick questions about each. It takes about 15 minutes. We record your answers, how long you take, how often you look again, your screen’s width and sharpness and the first name or initials you type below, and nothing else. You can skip any question and stop at any time.' }),
    h('p', { id: 'mode-line', class: 'mode' }),
  );
  if (snap && !snap.run.finished_at && snap.pos > 0) {
    const sc = buildScreens(snap.run.orders)[snap.pos] || { step: 2 };
    const box = h('div', { class: 'screen' },
      h('p', {}, h('strong', { text: 'Welcome back. ' }), `You stopped partway through step ${sc.step} of ${STEPS}.`),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => resume(snap) }, 'Pick up where I left off'),
        h('button', { type: 'button', class: 'btn text', onclick: () => { clearSnap(); renderWelcome(); } }, 'Start again')));
    sec.append(box);
  } else {
    const input = h('input', { id: 'initials', name: 'initials', type: 'text', autocomplete: 'off', autocapitalize: 'words', spellcheck: 'false', maxlength: '40', enterkeyhint: 'go', 'aria-describedby': 'initials-msg' });
    const msg = h('p', { class: 'msg', id: 'initials-msg', role: 'alert' });
    const form = h('form', { novalidate: true },
      h('div', {}, h('label', { class: 'field', for: 'initials', text: 'Your first name or initials' }), input),
      msg,
      h('div', { class: 'actions' }, h('button', { type: 'submit', class: 'btn primary' }, 'Start')));
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const v = input.value.trim().slice(0, 40);
      if (!v) { msg.textContent = 'Type a first name or initials to start.'; input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
      start(v);
    });
    sec.append(form);
  }
  UI.mount(sec, sec.querySelector('h1'));
  UI.modeChanged();
}
function start(initials) {
  S.runId = newId(); S.run = newRun(initials); S.screens = buildScreens(S.run.orders); S.drafts = {};
  Store.ready.then(() => { if (S.run) { S.run.mode = Store.mode; S.run.mode_note = Store.note; Store.save(); } });
  preload();
  go(1);
}
function resume(snap) {
  S.runId = snap.runId; S.run = snap.run; S.screens = buildScreens(S.run.orders); S.drafts = {};
  S.run.resumed = (S.run.resumed || 0) + 1;
  let p = Math.min(snap.pos, S.screens.length - 1);
  const sc = S.screens[p];
  if (sc.kind === 'expose') item(sc.item).interrupted++;
  Store.ready.then(() => { if (S.run) { S.run.mode = Store.mode; S.run.mode_note = Store.note; Store.save(); } });
  preload();
  go(p);
}

// ------------------------------------------------------------------ a step's opening screen
const STEP_NAMES = { 2: 'Drawings', 3: 'Symbols', 4: 'A card and a drawing', 5: 'The four', 6: 'Steps', 7: 'Small marks', 8: 'The end of an article', 9: 'Charts', 10: 'Sentences' };   // step 4 names what the reader sees (D2-950)
function renderReady(sc) {
  const sec = h('section', { class: 'screen' });
  const notice = takeNotice(); if (notice) sec.append(notice);
  sec.append(
    h('p', { class: 'eyebrow', text: STEP_NAMES[sc.step] }),
    h('h2', { text: sc.title }),
    ...sc.body.map((t) => h('p', { text: t })),
    h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn primary', onclick: () => next() }, sc.button)));
  UI.mount(sec);
}

// ------------------------------------------------------------------ a timed look
// The clock starts only once every image in the look has loaded and decoded, and it counts only while the page is
// visible. A reader who leaves mid-look picks up the rest of it on return.
function renderExpose(sc, again, back) {
  const it = item(sc.item);
  const cap = h('h2', { class: 'eyebrow', text: sc.caption });
  const secs = sc.seconds;
  const live = h('p', { class: 'sr', 'aria-live': 'polite' });
  const sec = h('section', { class: 'screen expose' }, cap, h('p', { class: 'hint tight', text: again ? `Another look, for ${secs} seconds.` : `Shows for ${secs} seconds.` }));
  const notice = takeNotice(); if (notice) sec.prepend(notice);
  const stage = stimulus(sc.stim);
  const loading = h('p', { class: 'loading', role: 'status', text: 'Loading…' });
  sec.append(loading);
  if (again) sec.append(h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn line', onclick: () => finish(true) }, 'Back to the question')));
  sec.append(live);
  stage.hidden = true; sec.insertBefore(stage, loading);
  UI.mount(sec, cap);
  if (again) it.show_again++;
  let watch = null, tick = null, ended = false;
  const total = secs * 1000 * SCALE;
  function finish(early) {
    if (ended) return; ended = true;
    clearInterval(tick);
    const shown = watch ? Math.round(watch.stop() / SCALE / 100) / 10 : 0;
    if (watch) (again ? it.again_seconds : it.shown_seconds).push(shown);
    S.timer = null;
    writeSnap();   // the next answer carries this look's record to the store
    if (again) back(); else next();
  }
  S.timer = { cancel() { ended = true; clearInterval(tick); if (watch) watch.stop(); } };
  const imgs = [...stage.querySelectorAll('img')];
  const fail = () => {
    if (ended) return;
    it.load_failed++;
    loading.replaceWith(h('div', { class: 'screen' },
      h('p', { role: 'alert', class: 'msg', text: 'This image didn’t load.' }),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => { ended = true; again ? renderExpose(sc, true, back) : renderExpose(sc, false); } }, 'Try again'),
        h('button', { type: 'button', class: 'btn text', onclick: () => { ended = true; S.timer = null; again ? back() : next(); } }, again ? 'Back to the question' : 'Skip it'))));
  };
  within(Promise.all(imgs.map(ready)), 20000).then(() => {
    if (ended) return;
    loading.remove(); stage.hidden = false;
    live.textContent = `Showing now for ${secs} seconds.`;
    watch = stopwatch();
    const paint = () => {
      const left = Math.max(0, total - watch.ms());
      UI.timing(Math.max(1, Math.ceil(left / 1000 / SCALE)), left / total);
      if (left <= 0) finish(false);
    };
    paint();
    tick = setInterval(paint, 100);
  }, fail);
}
