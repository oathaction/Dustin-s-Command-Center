<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="392" viewBox="0 0 1180 392" role="img" aria-label="Loop R8, weave card drawing. Housing scarcity raises homeowners&#x27; equity, which raises housing scarcity." data-view="weave-card" data-loop="R8" data-direction="weave" data-reform="R-30"><title>Loop R8, weave card drawing. Housing scarcity raises homeowners&#x27; equity, which raises housing scarcity.</title><style>.mt{font-family:Inter, 'Helvetica Neue', Arial, sans-serif}.md{font-family:'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif;font-weight:800;letter-spacing:-0.01em}.mb{font-weight:700}.ms{font-weight:600}.mi{font-style:italic}</style><rect x="0" y="0" width="1180" height="392" fill="#FFFFFF"/><text x="360.0" y="42.0" class="mt mb" font-size="13" fill="#121212">This loop</text><text x="630.0" y="30.0" class="mt mb" font-size="13" fill="#4E535B">Its other connections to the rest of the system</text><line x1="294" y1="104.0" x2="950.0" y2="104.0" stroke="#121212" stroke-width="1.25"/><g class="var" data-node="A5" data-label="Housing scarcity" data-target="R-30" data-red="1"><rect x="250.0" y="85.0" width="50" height="38" rx="7" fill="none" stroke="#E63946" stroke-width="3"/><rect x="254.0" y="89.0" width="42" height="30" rx="5" fill="#121212"/><text x="275.0" y="110.0" class="md" font-size="16" fill="#FFFFFF" text-anchor="middle">A5</text><text x="242.0" y="105.0" class="mt mb" font-size="16" fill="#121212" text-anchor="end">Housing scarcity</text><text x="242.0" y="123.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">Higher: homes are harder to find or</text><text x="242.0" y="138.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">afford in the places people want to</text><text x="242.0" y="153.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">live.</text></g><line x1="294" y1="190.0" x2="950.0" y2="190.0" stroke="#121212" stroke-width="1.25"/><g class="var" data-node="A6" data-label="Owner home equity"><rect x="254.0" y="175.0" width="42" height="30" rx="5" fill="#121212"/><text x="275.0" y="196.0" class="md" font-size="16" fill="#FFFFFF" text-anchor="middle">A6</text><text x="242.0" y="191.0" class="mt mb" font-size="16" fill="#121212" text-anchor="end">Owner home equity</text><text x="242.0" y="209.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">Higher: owners hold more value in</text><text x="242.0" y="224.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">their homes, relative to their</text><text x="242.0" y="239.0" class="mt" font-size="13" fill="#4E535B" text-anchor="end">mortgages and to renters&#x27; wealth.</text></g><g class="link ctx" data-link="L40" data-from="A5" data-to="A4" data-sign="-" data-grade="well-supported" data-delay="S" data-type="causal"><circle cx="640.0" cy="104.0" r="3.5" fill="#5D636D"/><path d="M640.0 100.0 L640.0 61.5" fill="none" stroke="#5D636D" stroke-width="1.5" data-texture="solid"/><g class="ticks" data-ticks="1"><line x1="645.0" y1="93.0" x2="635.0" y2="93.0" stroke="#5D636D" stroke-width="1.5"/></g><polygon points="640.0,53.0 644.5,62.0 635.5,62.0" fill="#5D636D"/><text x="640.0" y="44.0" class="mt mb" font-size="13" fill="#121212" text-anchor="middle">A4</text></g><g class="link ctx" data-link="LE17" data-from="A5" data-to="EC9" data-sign="+" data-grade="well-supported" data-delay="M" data-type="causal" data-target="R-30"><circle cx="696.0" cy="104.0" r="3.5" fill="#E63946"/><path d="M696.0 100.0 L696.0 61.5" fill="none" stroke="#E63946" stroke-width="2.5" data-texture="solid" data-red="1"/><g class="ticks" data-ticks="2"><line x1="701.0" y1="93.0" x2="691.0" y2="93.0" stroke="#121212" stroke-width="1.5"/><line x1="701.0" y1="88.0" x2="691.0" y2="88.0" stroke="#121212" stroke-width="1.5"/></g><polygon points="696.0,53.0 700.5,62.0 691.5,62.0" fill="#E63946"/><text x="696.0" y="44.0" class="mt mb" font-size="13" fill="#121212" text-anchor="middle">EC9</text></g><g class="link ctx" data-link="LE10