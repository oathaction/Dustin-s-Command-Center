ze="13" fill="#4E535B" text-anchor="middle">Well supported. Over 10 years.</text></g><g class="stationlabel" data-for="A5"><text x="122.0" y="309.9" class="d" font-size="22" fill="#121212" text-anchor="middle">Housing scarcity</text><text x="122.0" y="332.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">Higher: homes are harder to</text><text x="122.0" y="351.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">find or afford in the places</text><text x="122.0" y="370.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">people want to live.</text></g><g class="stationlabel" data-for="A6"><text x="738.0" y="309.9" class="d" font-size="22" fill="#121212" text-anchor="middle">Owner home equity</text><text x="738.0" y="332.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">Higher: owners hold more</text><text x="738.0" y="351.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">value in their homes, relative</text><text x="738.0" y="370.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">to their mortgages and to</text><text x="738.0" y="389.2" class="t" font-size="15" fill="#4E535B" text-anchor="middle">renters&#x27; wealth.</text></g></svg>