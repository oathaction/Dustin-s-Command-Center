 stroke-linejoin="round"/><text x="240.0" y="248.8" class="t b" font-size="14" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">−</text></g></g><g class="step" data-loop="R10" data-link="L53" data-from="C3" data-to="C4" data-sign="-" data-grade="plausible" data-delay="M" data-type="causal"><path d="M240.00 130.00 L620.00 510.00" fill="none" stroke="#121212" stroke-width="6.0" stroke-dasharray="27 12" data-texture="9 4" data-weight="6.0"/><g class="ticks" data-ticks="2"><line x1="577.6" y1="478.9" x2="588.9" y2="467.6" stroke="#121212" stroke-width="2"/><line x1="572.6" y1="473.9" x2="583.9" y2="462.6" stroke="#121212" stroke-width="2"/></g><g class="sign" data-for="L53" data-sign="-"><polygon points="416.6,317.9 432.1,333.4 442.4,332.4 443.4,322.1 427.9,306.6" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/><text x="430.0" y="324.8" class="t b" font-size="14" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">−</text></g></g><g class="step" data-loop="R10" data-link="L42" data-from="C4" data-to="C1" data-sign="+" data-grade="documented" data-delay="M" data-type="causal"><path d="M620.00 510.00 L392.00 510.00" fill="none" stroke="#121212" stroke-width="6.0" data-texture="solid" data-weight="6.0"/><g class="ticks" data-ticks="2"><line x1="444.0" y1="502.0" x2="444.0" y2="518.0" stroke="#121212" stroke-width="2"/><line x1="451.0" y1="502.0" x2="451.0" y2="518.0" stroke="#121212" stroke-width="2"/></g><g class="sign" data-for="L42" data-sign="+"><polygon points="517.0,502.0 495.0,502.0 488.5,510.0 495.0,518.0 517.0,518.0" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/><text x="506.0" y="514.8" class="t b" font-size="14" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">+</text></g></g><g class="var" data-node="C1" data-label="Safe seats" data-kind="capsule"><rect x="362.0" y="488.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="392.0" y="515.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C1</text></g><g class="var" data-node="C2" data-label="Primary decisiveness" data-kind="ring" data-red="1"><circle cx="240.0" cy="358.0" r="22" fill="#FFFFFF" stroke="#E63946" stroke-width="4"/><text x="240.0" y="363.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C2</text></g><g class="var" data-node="C3" data-label="Electoral pressure" data-kind="capsule"><rect x="210.0" y="108.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="240.0" y="135.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C3</text></g><g class="var" data-node="C4" data-label="Incumbent control of election rules" data-kind="capsule"><rect x="590.0" y="488.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="620.0" y="515.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C4</text></g><g class="steplabel" data-for="L42"><text x="506.0" y="545.0" class="t b" font-size="13" fill="#121212" text-anchor="middle">L42</text><text x="506.0" y="563.0" class="t s" font-size="15" fill="#121212" text-anchor="middle">Incumbent-drawn maps create</text><text x="506.0" y="581.0" class="t s" font-size="15" fill="#121212" text-anchor="middle">safe seats</text><rect x="419.4" y="590.0" width="7" height="7" fill="#121212" data-record="1"/><text x="431.4" y="599.0" class="t" font-size="13" fill="#4E535B">Documented. 2 to 10 years.</text></g><g class="steplabel" data-for="L53"><text x="445.6" y="272.4" class="t b" font-size="13" fill="#121212">L53</text><text x="445.6" y="290.4" class="t s" font-size="15" fill="#121212">Officials safe from defeat write</text><text x="445.6" y="308.4" class="t s" font-size="15" fill="#121212">rules for themselves</text><text x="445.6" y="326.4" class="t" font-size="13" fill="#4E535B">Plausible. 2 to 10 years.</text><text x="445.6" y="344.4" class="t b" font-size="13" fill="#121212" data-weakest="L53">Least certain step</text></g><g class="steplabel" data-for="L25"><text x="218.0" y="221.0" class="t b" font-size="13" fill="#121212" text-anchor="end">L25</text><text x="218.0" y="239.0" class="t s" font-size="15" fill="#121212" text-anchor="end">Decisive primaries reduce</text><text x="218.0" y="257.0" class="t s" font-size="15" fill="#121212" text-anchor="end">general-election pressure</text><text x="218.0" y="275.0" class="t" font-size="13" fill="#4E535B" text-anchor="end">Well supported. Under 2 years.</text></g><g class="steplabel" data-for="L08"><text x="300.4" y="426.6" class="t b" font-size="13" fill="#121212" text-anchor="end">L08</text><text x="300.4" y="444.6" class="t s" font-size="15" fill="#121212" text-anchor="end">Safe seats make the primary</text><text x="300.4" y="462.6" class="t s" font-size="15" fill="#121212" text-anchor="end">decisive</text><rect x="115.4" y="471.6" width="7" height="7" fill="#121212" data-record="1"/><text x="127.4" y="480.6" class="t" font-size="13" fill="#4E535B">Documented. Under 2 years.</text></g><g class="stationlabel" data-for="C1"><text x="348.6" y="575.4" class="d" font-size="22" fill="#121212" text-anchor="end">Safe seats</text><text x="348.6" y="597.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">Higher: more seats are safe</text><text x="348.6" y="616.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">for one party.</text></g><g class="stationlabel" data-for="C2"><text x="178.0" y="332.7" class="d" font-size="22" fill="#121212" text-anchor="end">Primary</text><text x="178.0" y="358.0" class="d" font-size="22" fill="#121212" text-anchor="end">decisiveness</text><text x="178.0" y="380.3" class="t" font-size="15" fill="#4E535B" text-anchor="end">Higher: more seats are</text><text x="178.0" y="399.3" class="t" font-size="15" fill="#4E535B" text-anchor="end">settled in the primary.</text></g><g class="stationlabel" data-for="C3"><text x="240.0" y="27.7" class="d" font-size="22" fill="#121212" text-anchor="middle">Electoral pressure</text><text x="240.0" y="50.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">Higher: incumbents face a</text><text x="240.0" y="69.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">more credible chance of</text><text x="240.0" y="88.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">defeat.</text></g><g class="stationlabel" data-for="C4"><text x="663.4" y="575.4" class="d" font-size="22" fill="#121212">Incumbent control</text><text x="663.4" y="600.7" class="d" font-size="22" fill="#121212">of election rules</text><text x="663.4" y="623.0" class="t" font-size="15" fill="#4E535B">Higher: incumbents have</text><text x="663.4" y="642.0" class="t" font-size="15" fill="#4E535B">more say over the rules of</text><text x="663.4" y="661.0" class="t" font-size="15" fill="#4E535B">their own elections.</text></g></svg>