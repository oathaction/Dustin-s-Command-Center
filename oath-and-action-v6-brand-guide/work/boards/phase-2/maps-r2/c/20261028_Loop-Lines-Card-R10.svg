 stroke-linejoin="round"/><text x="278.0" y="263.8" class="t b" font-size="13" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">−</text></g></g><g class="step" data-loop="R10" data-link="L53" data-from="C3" data-to="C4" data-sign="-" data-grade="plausible" data-delay="M" data-type="causal"><path d="M278.00 168.00 L582.00 472.00" fill="none" stroke="#121212" stroke-width="6.0" stroke-dasharray="27 12" data-texture="9 4" data-weight="6.0"/><g class="ticks" data-ticks="2"><line x1="539.6" y1="440.9" x2="550.9" y2="429.6" stroke="#121212" stroke-width="2"/><line x1="534.6" y1="435.9" x2="545.9" y2="424.6" stroke="#121212" stroke-width="2"/></g><g class="sign" data-for="L53" data-sign="-"><polygon points="418.7,318.6 431.4,331.3 440.3,330.3 441.3,321.4 428.6,308.7" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/><text x="430.0" y="324.6" class="t b" font-size="13" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">−</text></g></g><g class="step" data-loop="R10" data-link="L42" data-from="C4" data-to="C1" data-sign="+" data-grade="documented" data-delay="M" data-type="causal"><path d="M582.00 472.00 L399.60 472.00" fill="none" stroke="#121212" stroke-width="6.0" data-texture="solid" data-weight="6.0"/><g class="ticks" data-ticks="2"><line x1="451.6" y1="464.0" x2="451.6" y2="480.0" stroke="#121212" stroke-width="2"/><line x1="458.6" y1="464.0" x2="458.6" y2="480.0" stroke="#121212" stroke-width="2"/></g><g class="sign" data-for="L42" data-sign="+"><polygon points="499.8,465.0 481.8,465.0 476.3,472.0 481.8,479.0 499.8,479.0" fill="#121212" stroke="#121212" stroke-width="2" stroke-linejoin="round"/><text x="490.8" y="476.6" class="t b" font-size="13" fill="#FFFFFF" text-anchor="middle" data-sign-glyph="1">+</text></g></g><g class="var" data-node="C1" data-label="Safe seats" data-kind="capsule"><rect x="369.6" y="450.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="399.6" y="477.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C1</text></g><g class="var" data-node="C2" data-label="Primary decisiveness" data-kind="ring" data-red="1"><circle cx="278.0" cy="350.4" r="22" fill="#FFFFFF" stroke="#E63946" stroke-width="4"/><text x="278.0" y="355.9" class="t b" font-size="15" fill="#121212" text-anchor="middle">C2</text></g><g class="var" data-node="C3" data-label="Electoral pressure" data-kind="capsule"><rect x="248.0" y="146.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="278.0" y="173.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C3</text></g><g class="var" data-node="C4" data-label="Incumbent control of election rules" data-kind="capsule"><rect x="552.0" y="450.0" width="60.0" height="44" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="3"/><text x="582.0" y="477.5" class="t b" font-size="15" fill="#121212" text-anchor="middle">C4</text></g><g class="steplabel" data-for="L42"><text x="490.8" y="521.0" class="t b" font-size="13" fill="#121212" text-anchor="middle">L42</text><text x="490.8" y="539.0" class="t s" font-size="15" fill="#121212" text-anchor="middle">Incumbent-drawn maps create</text><text x="490.8" y="557.0" class="t s" font-size="15" fill="#121212" text-anchor="middle">safe seats</text><rect x="404.2" y="566.0" width="7" height="7" fill="#121212" data-record="1"/><text x="416.2" y="575.0" class="t" font-size="13" fill="#4E535B">Documented. 2 to 10 years.</text></g><g class="steplabel" data-for="L53"><text x="465.4" y="252.6" class="t b" font-size="13" fill="#121212">L53</text><text x="465.4" y="270.6" class="t s" font-size="15" fill="#121212">Officials safe from defeat write</text><text x="465.4" y="288.6" class="t s" font-size="15" fill="#121212">rules for themselves</text><text x="465.4" y="306.6" class="t" font-size="13" fill="#4E535B">Plausible. 2 to 10 years.</text><text x="465.4" y="324.6" class="t b" font-size="13" fill="#121212" data-weakest="L53">Least certain step</text></g><g class="steplabel" data-for="L25"><text x="256.0" y="236.2" class="t b" font-size="13" fill="#121212" text-anchor="end">L25</text><text x="256.0" y="254.2" class="t s" font-size="15" fill="#121212" text-anchor="end">Decisive primaries reduce</text><text x="256.0" y="272.2" class="t s" font-size="15" fill="#121212" text-anchor="end">general-election pressure</text><text x="256.0" y="290.2" class="t" font-size="13" fill="#4E535B" text-anchor="end">Well supported. Under 2 years.</text></g><g class="steplabel" data-for="L08"><text x="303.4" y="423.6" class="t b" font-size="13" fill="#121212" text-anchor="end">L08</text><text x="303.4" y="441.6" class="t s" font-size="15" fill="#121212" text-anchor="end">Safe seats make the primary</text><text x="303.4" y="459.6" class="t s" font-size="15" fill="#121212" text-anchor="end">decisive</text><rect x="118.4" y="468.6" width="7" height="7" fill="#121212" data-record="1"/><text x="130.4" y="477.6" class="t" font-size="13" fill="#4E535B">Documented. Under 2 years.</text></g><g class="stationlabel" data-for="C1"><text x="356.2" y="537.4" class="d" font-size="22" fill="#121212" text-anchor="end">Safe seats</text><text x="356.2" y="559.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">Higher: more seats are safe</text><text x="356.2" y="578.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">for one party.</text></g><g class="stationlabel" data-for="C2"><text x="216.0" y="325.1" class="d" font-size="22" fill="#121212" text-anchor="end">Primary</text><text x="216.0" y="350.4" class="d" font-size="22" fill="#121212" text-anchor="end">decisiveness</text><text x="216.0" y="372.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">Higher: more seats are</text><text x="216.0" y="391.7" class="t" font-size="15" fill="#4E535B" text-anchor="end">settled in the primary.</text></g><g class="stationlabel" data-for="C3"><text x="278.0" y="65.7" class="d" font-size="22" fill="#121212" text-anchor="middle">Electoral pressure</text><text x="278.0" y="88.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">Higher: incumbents face a</text><text x="278.0" y="107.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">more credible chance of</text><text x="278.0" y="126.0" class="t" font-size="15" fill="#4E535B" text-anchor="middle">defeat.</text></g><g class="stationlabel" data-for="C4"><text x="644.0" y="437.2" class="d" font-size="22" fill="#121212">Incumbent control</text><text x="644.0" y="462.5" class="d" font-size="22" fill="#121212">of election rules</text><text x="644.0" y="484.8" class="t" font-size="15" fill="#4E535B">Higher: incumbents have</text><text x="644.0" y="503.8" class="t" font-size="15" fill="#4E535B">more say over the rules of</text><text x="644.0" y="522.8" class="t" font-size="15" fill="#4E535B">their own elections.</text></g></svg>