 x="60.0" y="654.0" class="mt" font-size="15" fill="#4E535B">credible chance of defeat.</text></g><g class="var" data-node="C4" data-label="Incumbent control of election rules"><rect x="40.0" y="830.0" width="286.0" height="165.0" rx="2" fill="#DCD9D2"/><rect x="40.0" y="830.0" width="5" height="165.0" fill="#121212"/><text x="60.0" y="859.0" class="md" font-size="16" fill="#121212">C4</text><text x="60.0" y="881.0" class="mt ms" font-size="16" fill="#121212">Incumbent control</text><text x="60.0" y="901.0" class="mt ms" font-size="16" fill="#121212">of election rules</text><text x="60.0" y="928.0" class="mt" font-size="15" fill="#4E535B">Higher: incumbents have more</text><text x="60.0" y="948.0" class="mt" font-size="15" fill="#4E535B">say over the rules of their own</text><text x="60.0" y="968.0" class="mt" font-size="15" fill="#4E535B">elections.</text></g><g class="pill" data-for="L08"><rect x="56.0" y="195.0" width="36.0" height="24.0" rx="12.0" fill="#FFFFFF" stroke="#E63946" stroke-width="1.5"/><rect x="62.0" y="203.5" width="7" height="7" fill="#121212" data-record="1"/><text x="80.0" y="212.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><g class="pill" data-for="L25"><circle cx="74.0" cy="481.0" r="12.0" fill="#FFFFFF" stroke="#E63946" stroke-width="1.5"/><text x="74.0" y="486.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><g class="pill" data-for="L53"><circle cx="74.0" cy="755.0" r="12.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="74.0" y="760.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><g class="pill" data-for="L42"><rect x="-8.0" y="468.2" width="36.0" height="24.0" rx="12.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><rect x="-2.0" y="476.8" width="7" height="7" fill="#121212" data-record="1"/><text x="16.0" y="485.6" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><g class="steplabel" data-for="L08"><text x="100.0" y="158.0" class="mt mb" font-size="13" fill="#121212">L08</text><text x="100.0" y="178.0" class="mt ms" font-size="15" fill="#121212">Safe seats make the</text><text x="100.0" y="198.0" class="mt ms" font-size="15" fill="#121212">primary decisive</text><text x="100.0" y="218.0" class="mt" font-size="13" fill="#4E535B">Documented  ·  under 2 years</text><text x="100.0" y="238.0" class="mt mb" font-size="13" fill="#121212">R-01 acts here</text></g><g class="steplabel" data-for="L25"><text x="100.0" y="432.0" class="mt mb" font-size="13" fill="#121212">L25</text><text x="100.0" y="452.0" class="mt ms" font-size="15" fill="#121212">Decisive primaries reduce</text><text x="100.0" y="472.0" class="mt ms" font-size="15" fill="#121212">general-election pressure</text><text x="100.0" y="492.0" class="mt" font-size="13" fill="#4E535B">Well supported  ·  under 2 years</text><text x="100.0" y="512.0" class="mt mb" font-size="13" fill="#121212">R-01 acts here</text></g><g class="steplabel" data-for="L53"><text x="100.0" y="706.0" class="mt mb" font-size="13" fill="#121212">L53  ·  least certain</text><text x="100.0" y="726.0" class="mt ms" font-size="15" fill="#121212">Officials safe from defeat</text><text x="100.0" y="746.0" class="mt ms" font-size="15" fill="#121212">write rules for themselves</text><text x="100.0" y="766.0" class="mt" font-size="13" fill="#4E535B">Plausible  ·  2 to 10 years</text></g><g class="steplabel" data-for="L42"><text x="40.0" y="1023.0" class="mt mb" font-size="13" fill="#121212">L42  ·  the return line</text><text x="40.0" y="1043.0" class="mt ms" font-size="15" fill="#121212">Incumbent-drawn</text><text x="40.0" y="1063.0" class="mt ms" font-size="15" fill="#121212">maps create safe seats</text><text x="40.0" y="1083.0" class="mt" font-size="13" fill="#4E535B">Documented  ·  2 to 10 years</text></g></svg>