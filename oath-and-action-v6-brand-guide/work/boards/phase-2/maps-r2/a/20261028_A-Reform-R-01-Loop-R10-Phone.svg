 font-size="15" fill="#4E535B">Higher: incumbents face a</text><text x="68.0" y="654.0" class="mt" font-size="15" fill="#4E535B">more credible chance of</text><text x="68.0" y="674.0" class="mt" font-size="15" fill="#4E535B">defeat.</text></g><g class="var" data-node="C4" data-label="Incumbent control of election rules"><rect x="48.0" y="851.0" width="278.0" height="165.0" rx="2" fill="#DCD9D2"/><rect x="48.0" y="851.0" width="5" height="165.0" fill="#121212"/><text x="68.0" y="880.0" class="md" font-size="16" fill="#121212">C4</text><text x="68.0" y="902.0" class="mt ms" font-size="16" fill="#121212">Incumbent control</text><text x="68.0" y="922.0" class="mt ms" font-size="16" fill="#121212">of election rules</text><text x="68.0" y="949.0" class="mt" font-size="15" fill="#4E535B">Higher: incumbents have more</text><text x="68.0" y="969.0" class="mt" font-size="15" fill="#4E535B">say over the rules of their own</text><text x="68.0" y="989.0" class="mt" font-size="15" fill="#4E535B">elections.</text></g><g class="pill" data-for="L08"><rect x="64.0" y="195.0" width="36.0" height="24.0" rx="12.0" fill="#FFFFFF" stroke="#E63946" stroke-width="1.5"/><rect x="70.0" y="203.5" width="7" height="7" fill="#121212" data-record="1"/><text x="88.0" y="212.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><g class="pill" data-for="L25"><circle cx="82.0" cy="481.0" r="12.0" fill="#FFFFFF" stroke="#E63946" stroke-width="1.5"/><text x="82.0" y="486.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><g class="pill" data-for="L53"><circle cx="82.0" cy="776.0" r="12.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="82.0" y="781.4" class="mt mb" font-size="15" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><g class="pill" data-for="L42"><rect x="2.0" y="478.8" width="36.0" height="24.0" rx="12.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><rect x