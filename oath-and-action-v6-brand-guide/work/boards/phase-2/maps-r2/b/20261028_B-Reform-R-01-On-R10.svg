B" text-anchor="end">Higher: incumbents have</text><text x="222.00" y="396.00" class="bt" font-size="14" fill="#4E535B" text-anchor="end">more say over the rules of</text><text x="222.00" y="414.00" class="bt" font-size="14" fill="#4E535B" text-anchor="end">their own elections.</text></g><g class="lbl steplabel" data-for="L08" data-kind="step"><g class="pill" data-for="L08"><rect x="644.29" y="143.21" width="34.69" height="22" rx="11.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><rect x="652.29" y="150.71" width="7" height="7" fill="#121212" data-record="1"/><text x="667.64" y="159.25" class="bt b7" font-size="14" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><text x="686.98" y="158.71" class="bt b7" font-size="13" fill="#121212">L08 · same direction</text><text x="644.29" y="178.71" class="bt b6" font-size="15" fill="#121212">Safe seats make the</text><text x="644.29" y="198.71" class="bt b6" font-size="15" fill="#121212">primary decisive</text><text x="644.29" y="215.71" class="bt" font-size="13" fill="#4E535B">Documented · under 2 years</text><text x="644.29" y="232.71" class="bt b7" font-size="13" fill="#121212">R-01 acts on this step</text></g><g class="lbl steplabel" data-for="L25" data-kind="step"><g class="pill" data-for="L25"><rect x="666.21" y="522.71" width="24.00" height="22" rx="11.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="678.21" y="538.75" class="bt b7" font-size="14" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><text x="698.21" y="538.21" class="bt b7" font-size="13" fill="#121212">L25 · opposite direction</text><text x="666.21" y="558.21" class="bt b6" font-size="15" fill="#121212">Decisive primaries reduce</text><text x="666.21" y="578.21" class="bt b6" font-size="15" fill="#121212">general-election pressure</text><text x="666.21" y="595.21" class="bt" font-size="13" fill="#4E535B">Well supported · under 2 years</text><text x="666.21" y="612.21" class="bt b7" font-size="13"