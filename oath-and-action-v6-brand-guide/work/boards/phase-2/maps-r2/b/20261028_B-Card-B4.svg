nd="station"><text x="341.26" y="485.00" class="bt b6" font-size="16" fill="#121212" text-anchor="end">Sanction applied</text><text x="341.26" y="503.00" class="bt" font-size="14" fill="#4E535B" text-anchor="end">Higher: more incumbents</text><text x="341.26" y="521.00" class="bt" font-size="14" fill="#4E535B" text-anchor="end">lose or retire under threat of</text><text x="341.26" y="539.00" class="bt" font-size="14" fill="#4E535B" text-anchor="end">defeat in an election cycle.</text></g><g class="lbl steplabel" data-for="L23" data-kind="step"><g class="pill" data-for="L23"><rect x="660.82" y="207.00" width="24.00" height="22" rx="11.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="672.82" y="223.04" class="bt b7" font-size="14" fill="#121212" text-anchor="middle" data-sign-glyph="1">−</text></g><text x="692.82" y="222.50" class="bt b7" font-size="13" fill="#121212">L23 · opposite direction</text><text x="660.82" y="242.50" class="bt b6" font-size="15" fill="#121212">Poor service raises</text><text x="660.82" y="262.50" class="bt b6" font-size="15" fill="#121212">incumbents&#x27; risk of losing</text><text x="660.82" y="279.50" class="bt" font-size="13" fill="#4E535B">Well supported · under 2 years</text></g><g class="lbl steplabel" data-for="L24" data-kind="step"><g class="pill" data-for="L24"><rect x="429.42" y="540.50" width="24.00" height="22" rx="11.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="441.42" y="556.54" class="bt b7" font-size="14" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><text x="461.42" y="556.00" class="bt b7" font-size="13" fill="#121212">L24 · same direction</text><text x="511.00" y="576.00" class="bt b6" font-size="15" fill="#121212" text-anchor="middle">Electoral pressure leads to</text><text x="511.00" y="596.00" class="bt b6" font-size="15" fill="#121212" text-anchor="middle">actual defeats</text><text x="511.00" y="613.00" class="bt" font-size="13" fill="#4E535B" text-anchor="middle">Well supported · 2 to 10 years</text></g><g class="lbl steplabel" data-for="L54" data-kind="step"><g class="pill" data-for="L54"><rect x="197.92" y="187.00" width="24.00" height="22" rx="11.0" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/><text x="209.92" y="203.04" class="bt b7" font-size="14" fill="#121212" text-anchor="middle" data-sign-glyph="1">+</text></g><text x="229.92" y="202.50" class="bt b7" font-size="13" fill="#121212">L54 · same direction</text><text x="361.18" y="222.50" class="bt b6" font-size="15" fill="#121212" text-anchor="end">Removing incumbents</text><text x="361.18" y="242.50" class="bt b6" font-size="15" fill="#121212" text-anchor="end">improves performance of</text><text x="361.18" y="262.50" class="bt b6" font-size="15" fill="#121212" text-anchor="end">those remaining</text><text x="361.18" y="279.50" class="bt" font-size="13" fill="#4E535B" text-anchor="end">Well supported · 2 to 10 years</text></g></svg>