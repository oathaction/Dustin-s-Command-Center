<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 201" width="720" height="201" role="img" data-oa-form="dumbbell" data-oa-width="720"><title>The gap in reported voting between citizens 18 to 24 and those 65 and over grew from 23 points in 2020 to 27 in 2024.</title><desc>Dumbbell chart of the share of citizens who reported voting, by age group, in 2020 and 2024. Reported voting fell 3.7 points among citizens 18 to 24, to 47.7 percent, and stayed near 75 percent among those 65 and over, so the gap between the youngest and oldest grew from 23 points to 27.</desc><rect width="100%" height="100%" fill="rgb(220, 217, 210)"/><text x="127" y="17" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">40</text><text x="218.9" y="17" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">50</text><text x="310.8" y="17" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">60</text><text x="402.7" y="17" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">70</text><text x="494.6" y="17" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">80%</text><text x="0" y="52.3" font-size="15px" fil