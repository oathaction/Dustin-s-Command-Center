<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 463" width="720" height="463" role="img" data-oa-form="big-number" data-oa-width="720"><title>Nearly nine in ten Republican and Democratic voters favored a ban on stock trading by members of Congress.</title><desc>A large figure: 86 percent of registered voters favored a ban on stock trading by members of Congress in a May 2023 survey, 88 percent of Democrats and 87 percent of Republicans. In 2026 the House passed H.R. 7008, 232 to 198, and a Senate vote to take it up got 53 votes, seven short of the 60 it needed.</desc><rect width="100%" height="100%" fill="rgb(220, 217, 210)"/><text x="0" y="112.5" font-size="116px" data-key="support-all" data-field="value" data-value="86" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="'Inter Tight', Arial, sans-serif" font-weight="800" letter-spacing="-2.32px" opacity="1">86%</text><text x="0" y="153.3" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1"><tspan x="0" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="15px" opacity="1">of registered voters favored a ban</tspan><tspan x="0" dy="19" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="15px" opacity="1">on stock trading by members of</tspan><tspan x="0" dy="19" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="15px" opacity="1">Congress</tspan></text><text x="338" y="14" font-size="13px" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">BY PARTY</text><text x="338" y="42" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">Democrats</text><rect x="338" y="52" width="382" height="24" fill="rgb(204, 202, 197)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><rect x="338" y="52" width="336.2" height="24" data-key="support-democrats" data-field="value" data-value="88" data-party="Democratic" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="666.2" y="69.3" font-size="15px" text-anchor="end" fill="rgb(255, 255, 255)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">88%</text><text x="338" y="106" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">Republicans</text><rect x="338" y="116" width="382" height="24" fill="rgb(204, 202, 197)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><rect x="338" y="116" width="332.3" height="24" data-key="support-republicans" data-field="value" data-value="87" data-party="Republican" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="662.3" y="133.3" font-size="15px" text-anchor="end" fill="rgb(255, 255, 255)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">87%</text><text x="338" y="160" font-size="13px" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">0</text><text x="720" y="160" font-size="13px" text-anchor="end" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">100%</text><line x1="0" y1="223.3" x2="720" y2="223.3" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="0" y="251.3" font-size="13px" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">WHAT CONGRESS DID NEXT</text><text x="0" y="286.3" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">The House passed H.R. 7008</text><text x="720" y="286.3" font-size="15px" text-anchor="end" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">232 to 198</text><text x="446.4" y="286.3" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">July 22, 2026</text><rect x="0" y="294.3" width="388.5" height="24" data-key="house-yes" data-field="value" data-value="232" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><rect x="388.5" y="294.3" width="331.5" height="24" data-key="house-no" data-field="value" data-value="198" fill="rgb(161, 162, 163)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="8" y="311.6" font-size="15px" fill="rgb(255, 255, 255)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">232 for</text><text x="712" y="311.6" font-size="15px" text-anchor="end" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">198 against</text><text x="0" y="363.3" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">The Senate vote to take it up fell short</text><text x="720" y="363.3" font-size="15px" text-anchor="end" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">53 to 47</text><text x="446.4" y="363.3" font-size="13px" text-anchor="middle" fill="rgb(78, 83, 91)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">September 30, 2026</text><rect x="0" y="371.3" width="381.6" height="24" data-key="senate-yes" data-field="value" data-value="53" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><rect x="381.6" y="371.3" width="338.4" height="24" data-key="senate-no" data-field="value" data-value="47" fill="rgb(161, 162, 163)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="8" y="388.6" font-size="15px" fill="rgb(255, 255, 255)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">53 for</text><text x="712" y="388.6" font-size="15px" text-anchor="end" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="700" opacity="1">47 against</text><line x1="432" y1="365.3" x2="432" y2="417.3" stroke-width="1px" data-key="senate-needed" data-field="value" data-value="60" fill="none" stroke="rgb(18, 18, 18)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="432" y="432.3" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="600" opacity="1">7 votes short of the 60 needed</text></svg>