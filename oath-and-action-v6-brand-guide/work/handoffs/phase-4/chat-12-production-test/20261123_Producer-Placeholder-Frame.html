<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placeholder frame, a producer's test</title>
<!-- The production reader's simulated producer (chat 12), from Rule 16.8's specifications alone. Token names are the
     ones Rule 16.8 prints; the values are the producer's guesses for a page without tokens.css (Guess 6). -->
<style>
:root{--oa-color-border-strong-on-newsprint:#121212;--oa-color-surface-newsprint:#DCD9D2;--oa-space-300:24px}
body{margin:0;padding:32px 16px;background:var(--oa-color-surface-newsprint);color:#121212;font:400 17px/1.5 Inter, system-ui, sans-serif}
.ph{position:relative;box-sizing:border-box;width:min(640px,100%);aspect-ratio:3/2;margin:0;padding:var(--oa-space-300);border:1px solid var(--oa-color-border-strong-on-newsprint)}
.ph i{position:absolute;width:12px;height:12px;border:0 solid var(--oa-color-border-strong-on-newsprint)}
.ph .tl{top:-7px;left:-7px;border-top-width:1px;border-left-width:1px}.ph .tr{top:-7px;right:-7px;border-top-width:1px;border-right-width:1px}
.ph .bl{bottom:-7px;left:-7px;border-bottom-width:1px;border-left-width:1px}.ph .br{bottom:-7px;right:-7px;border-bottom-width:1px;border-right-width:1px}
.ph .k{margin:0 0 8px;font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.ph p{margin:0 0 8px}
figcaption{width:min(640px,100%);margin-top:12px;font-size:15px}
@media (max-width:360px){.ph{padding:16px}}
</style>
</head>
<body>
<figure>
  <div class="ph">
    <i class="tl" aria-hidden="true"></i><i class="tr" aria-hidden="true"></i><i class="bl" aria-hidden="true"></i><i class="br" aria-hidden="true"></i>
    <p class="k">Placeholder</p>
    <p>Photograph to commission</p>
    <p>A county election official runs the public test of the vote-counting machines before an election, while residents watch, seen at eye level from behind the residents.</p>
    <p>3:2 · Black and white · Shot list, row 5 (Rule 16.1)</p>
  </div>
  <figcaption>Caption to write from the record: who, what, where and when, then the credit.</figcaption>
</figure>
</body>
</html>
