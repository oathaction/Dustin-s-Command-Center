<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 198" width="720" height="198" role="img" data-oa-form="range-bar" data-oa-width="720" data-fonts="Inter, Inter Tight"><title>From 2015 to 2025, the homeownership rate rose past the survey’s margin of error for all householders and for those under 45; for householders 45 and older, each change sits within it.</title><desc>Dots with margin of error lines for the change in the homeownership rate from 2015 to 2025, for all householders and five age groups. All householders rose 1.5 points, householders under 35 rose 2.0 points and those 35 to 44 rose 2.3 points, each past its margin and drawn as a filled dot. Householders 45 to 54 fell 0.2 points, 55 to 64 rose 0.5 points and 65 and over fell 0.3 points, each within its margin and drawn as an open dot. Set in Inter and Inter Tight. On a computer without both fonts, the labels fall back to another font and change width.</desc><rect width="100%" height="100%" fill="rgb(220, 217, 210)"/><circle cx="11" cy="9.8" r="6.5" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="30" y="15" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">Past the margin of error</text><circle cx="233.3" cy="9.8" r="6.5" fill="rgb(220, 217, 210)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><circle cx="233.3" cy="9.8" r="6.5" stroke-width="2px" fill="none" stroke="rgb(18, 18, 18)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="252.3" y="15" font-size="15px" fill="rgb(18, 18, 18)" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" opacity="1">Within the margin of error</text><path d="M152.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M236.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M320.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M405.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M489.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M573.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><path d="M657.5,33V171" stroke-width="1px" fill="none" stroke="rgb(180, 180, 179)" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="16px" opacity="1"/><text x="0" y="49.8" font-size="15px" fil