  /* round 3: a small mark in a dark step's label ink (a dot or ring on a district) takes the ground, as words there do */
  .oac-svg :is(.oac-f-on-seq-4, .oac-f-on-seq-5, .oac-f-on-mag-3, .oac-f-on-mag-4, .oac-f-on-div-1, .oac-f-on-div-5):not(.oac-t) { fill: Canvas; }

  .oac-svg .oac-t.oac-fc-on-gray { fill: Canvas; stroke: CanvasText; }
  .oac-svg:has(.oac-f-point, .oac-s-point) .oac-t.oac-fc-on-gray.oac-fc-on-context { fill: CanvasText; stroke: Canvas; }
  .oac-ev-k { forced-color-adjust: none; background: CanvasText; color: Canvas; }
  /* AX S3 (round 2 fix pass): a total (fc: 'total') takes the ground with a 2 px outline, apart from every step's ink */
  .oac-svg .oac-fc-total.oac-fc-total:not(.oac-t) { fill: Canvas; stroke: CanvasText; stroke-width: 2px; }
  /* AX-S1 (round 3 fix pass): a map's merged fill takes no edge, so S83's county outlines never draw in the dots' ink and

/* Print (D3-100): a figure taller than a page may break, but never inside its title block, its drawing, its source block or
